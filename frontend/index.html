5%22%2F%3E%0A%3C%2Fsvg%3E" type="image/svg+xml">
<style>
#galaxy { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; }

html:root {
  --space-deep:#040813; --space-raised:#0A1226;
  --blue:#2F6FE0; --accent:#4F8BFF; --hover:#6BA1FF; --focus:#9DBEFF;
  --cool-card:#F3F6FD; --cool-ink:#0E1A33; --cool-subtle:#4A5878;
  --current:#2FBF8F; --caution:#F2B44E; --unavailable:#8FA3C7;
  --synthetic:#A58BFF; --historical:#5BC8E8; --device:#FFD2A1;
  --canvas:var(--space-deep);
  --glass:rgba(10,18,38,.92); --scrim:rgba(4,8,19,.78);
  --surface:#111d36; --surface-sunken:#0a1328; --surface-hover:#1c3158;
  --border:rgba(130,170,255,.25); --border-strong:#7493c6;
  --ink:#f3f6fd; --ink-muted:#d6e1f7; --ink-subtle:#afc3e8;
  --primary:var(--accent); --primary-hover:var(--hover); --on-primary:white;
  --ok-ink:var(--current); --ok-tint:#0b2226; --ok-line:var(--current);
  --watch-ink:var(--caution); --watch-tint:#292016; --watch-line:var(--caution);
  --muted-ink:var(--unavailable); --muted-tint:#111c34; --muted-line:#7086ac;
  --danger-ink:#ffb7c6; --danger-tint:#2a1528; --danger-line:#e791aa;
  --info-ink:var(--unavailable); --info-tint:#111c34; --info-line:#7086ac;
  --prov-historical-ink:var(--historical); --prov-historical-tint:#0c2136;
  --prov-synthetic-ink:var(--synthetic); --prov-synthetic-tint:#1b1739;
  --prov-device-ink:var(--device); --prov-device-tint:#2b1f24;
  --shadow-pop:0 10px 36px #0004;
  --text-xs:.8125rem; --duration:170ms; --target:44px;
  color-scheme:dark;
}
html:root { background:linear-gradient(145deg,var(--space-deep),var(--space-raised)) fixed; }
body { margin:0; min-width:0; min-height:100vh; background:transparent!important; }
#root, .astro-app, #root .app { background:transparent; overflow:visible; isolation:auto; }
#galaxy { pointer-events:none; }
:root :focus-visible { outline:2px solid var(--focus); outline-offset:3px; }
::selection { background:var(--focus); color:var(--cool-ink); }
* { scrollbar-color:var(--border-strong) transparent; }
.astro-app { color:var(--ink); font-size:15px; line-height:1.5; }
.astro-app :where(button,select,summary,a) { touch-action:manipulation; }
.astro-app :where(button,select,summary) { font:inherit; }
.astro-app a { color:var(--accent); }
.astro-app a:hover { color:var(--hover); }
.astro-app .astro-skip { color:var(--hover); }
.astro-app :where(code,time,.mono) { overflow-wrap:anywhere; }
.astro-app :where(p,figure,dl) { margin:0; }
.astro-app h2 { margin:0 0 10px; font-size:19px; }
.astro-app h3 { margin:0; font-size:16px; }
.astro-app :where(small,figcaption,.secondary) { font-size:13px; color:var(--ink-subtle); }
.astro-header,.astro-main,.astro-footer { width:min(100% - 64px,1500px); margin-inline:auto; }
.astro-header { display:flex; gap:16px; justify-content:space-between; align-items:center; padding:14px 0; }
.astro-brand,.astro-tools,.astro-mode { display:flex; align-items:center; gap:10px; min-width:0; }
.astro-brand img { display:block; width:40px; height:40px; flex:none; }
.astro-brand h1 { font-size:24px; letter-spacing:-.04em; line-height:1.1; margin:0 0 3px; }
.astro-brand p { color:var(--ink-muted); font-size:13px; }
.astro-tools { flex-wrap:wrap; justify-content:flex-end; }
.astro-mode { font-size:13px; border:1px solid var(--border); border-radius:9px; gap:0; background:var(--scrim); }
.astro-mode > span { padding:8px 10px; }
.astro-mode .ui-mode { border:0; border-radius:0 8px 8px 0; font-size:13px; }
.astro-mode [data-mode=integrated] { background:var(--blue); color:white; }
.astro-mode [data-mode=fixture-preview] { background:var(--muted-tint); color:var(--unavailable); }
.astro-main { display:grid; gap:15px; padding:0 0 24px; }
.astro-footer { border-top:1px solid var(--border); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; padding:15px 0 24px; font-size:13px; color:var(--ink-muted); }
.astro-heading-scrim { background:var(--scrim); padding:4px 8px; border-radius:9px; }
.astro-skip { position:fixed; top:10px; left:15px; z-index:20; transform:translateY(-150%); background:var(--space-raised); padding:8px 14px; }
.astro-skip:focus { transform:none; }
.astro-app .glass,.astro-app .ui-card,.astro-app .crew-checkin {
  background:var(--glass); color:var(--ink); border:1px solid var(--border); border-radius:14px;
  backdrop-filter:blur(15px); box-shadow:var(--shadow-pop);
}
.astro-app .glass { padding:15px; min-width:0; }
.ui-drawer { background:var(--space-raised); color:var(--ink); }
.astro-app :is(.ui-button,.crew-checkin__button,.astro-button,select) {
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:44px; border:1px solid var(--border-strong); border-radius:9px;
  padding:8px 12px; background:var(--surface-sunken); color:var(--ink);
  font-size:14px; font-weight:600; text-align:center; text-decoration:none; cursor:pointer;
  transition:background-color var(--duration) ease,border-color var(--duration) ease,color var(--duration) ease;
}
.astro-app :is(.ui-button,.astro-button,.crew-checkin__button,select):not(:disabled):hover {
  background:var(--hover); border-color:var(--hover); color:var(--cool-ink);
}
.astro-app :is(.ui-button--primary,.crew-checkin__button:not(.crew-checkin__button--secondary),.astro-primary,button[aria-pressed=true]:not(.astro-motion)) {
  background:var(--blue); color:#fff; border-color:var(--blue); box-shadow:none;
}
.astro-app :is(.ui-button,.astro-button,.crew-checkin__button,select):disabled {
  opacity:1; color:var(--unavailable); border-color:var(--border); background:var(--surface-sunken); cursor:default;
}
.astro-app :is(.ui-button,.astro-button,.crew-checkin__button,input,select,summary,svg [tabindex]):focus-visible {
  outline:2px solid var(--focus); outline-offset:3px; box-shadow:none;
}
.astro-controls { display:flex; gap:12px; justify-content:space-between; align-items:center; flex-wrap:wrap; }
.astro-scenarios { display:flex; gap:7px; flex-wrap:wrap; }
.astro-scenarios button { text-align:left; flex-direction:column; align-items:flex-start; gap:1px; }
.astro-scenarios small { color:inherit; font-weight:400; }
.astro-clock { display:grid; gap:2px; }
.astro-clock time { color:var(--ink); font-variant-numeric:tabular-nums; font-weight:650; font-size:17px; }
.astro-transport { display:grid; gap:8px; }
.astro-transport__row,.astro-checkpoints,.astro-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.astro-transport__row input[type=range] { flex:1; min-width:120px; min-height:44px; accent-color:var(--blue); }
.astro-transport .astro-reset { margin-left:auto; }
.astro-banner { min-block-size:154px; display:grid; align-content:center; }
.astro-banner .ui-assessment { background:transparent; padding:0; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 18px; align-items:center; }
.astro-banner .ui-assessment__title { margin:0; font-size:clamp(21px,2.4vw,30px); line-height:1.15; }
.astro-banner .ui-assessment__top,.astro-banner .ui-assessment__missing { grid-column:1; }
.astro-banner .ui-assessment__actions { grid-column:2; grid-row:1/span 3; max-width:446px; margin:0; }
.astro-banner .ui-assessment__missing { color:var(--ink-muted); }
.astro-banner .ui-assessment__actions .ui-action { max-width:100%; }
.astro-grid { display:grid; grid-template-columns:minmax(0,1fr); gap:15px; align-items:start; }
.astro-grid > * { min-width:0; }
@media (min-width:800px) { .astro-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .astro-side { grid-column:1/-1; grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (min-width:1201px) { .astro-grid { grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1.2fr); } .astro-side { grid-column:auto; grid-template-columns:minmax(0,1fr); } }
.astro-stack,.astro-side,.astro-readings { display:grid; gap:12px; }
.astro-readings h2 { margin:0; padding:3px 7px; width:fit-content; background:var(--scrim); border-radius:5px; }
.astro-app .astro-source { display:grid; gap:6px; padding:14px; }
.astro-app .astro-source[data-selected=true] { border-color:var(--accent); box-shadow:inset 3px 0 var(--accent); }
.astro-source header,.astro-source footer { display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; }
.astro-reading { color:var(--ink); font-size:30px; font-weight:700; letter-spacing:-.03em; line-height:1.2; }
.astro-reading small { font-size:15px; letter-spacing:0; }
.astro-age { color:var(--ink-muted); font-size:13px; }
.astro-source summary,.astro-table-details summary,.astro-incidents summary { display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:44px; cursor:pointer; font-size:14px; color:var(--primary); }
.astro-source summary::after,.astro-table-details summary::after,.astro-incidents summary::after { content:'+'; }
.astro-source details[open] summary::after,.astro-table-details[open] summary::after,.astro-incidents[open] summary::after { content:'−'; }
.astro-source .ui-meta { margin-bottom:6px; }
.astro-source .ui-source__foot { padding:0; border:0; }
.astro-hero { display:grid; gap:12px; }
.astro-hero header { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:3px 12px; }
.astro-hero h2 { margin:0; }
.astro-scene { width:100%; max-height:380px; display:block; color:var(--accent); }
.astro-cabin-node[data-current=true] { color:var(--current); }
.astro-cabin-node[data-current=false] { color:var(--unavailable); }
.astro-cabin-node[data-stale=true] { color:var(--caution); }
.astro-cabin-node[data-current=true] .node-halo { animation:node-pulse 3.8s ease-in-out infinite; }
@keyframes node-pulse { 50% { opacity:.28; } }
.astro-hero-controls { display:flex; gap:7px; flex-wrap:wrap; }
.astro-hero-controls .astro-button { padding-inline:10px; }
.astro-callout-row { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
.astro-callout-row .astro-button { align-items:flex-start; flex-direction:column; text-align:left; gap:0; font-size:13px; padding:6px; }
.astro-callout-row small { color:inherit; }
.astro-note { padding:10px 12px; border:1px solid var(--border-strong); border-left:3px solid var(--accent); border-radius:8px; background:var(--scrim); color:var(--ink-muted); font-size:14px; }
.astro-note strong { color:var(--ink); }
.astro-comparison { display:grid; gap:4px; line-height:1.4; }
.astro-comparison .astro-agreement { width:max-content; max-width:100%; color:var(--unavailable); }
.astro-comparison[data-agrees=true] .astro-agreement { color:var(--current); }
.astro-app .crew-checkin { width:100%; max-width:none; padding:16px; }
.astro-app .crew-checkin__sample > summary { color:var(--accent); cursor:pointer; min-height:44px; padding-block:10px; }
.astro-app .crew-checkin__sample > summary span { font-size:13px; color:var(--ink-subtle); margin-left:8px; }
.astro-app .crew-checkin__reaction { margin-top:8px; }
.astro-app .crew-checkin__stimulus--go { background:var(--ok-tint); border-color:var(--current); color:var(--current); }
.astro-app .ui-table-wrap { max-inline-size:100%; overflow:auto; }
.astro-table-details .ui-table-wrap { max-height:275px; }
.astro-app .ui-rule { color:var(--ink-muted); word-break:normal; }
.astro-app .ui-assessment--insufficient_data .ui-badge { color:var(--unavailable); background:var(--muted-tint); border-color:var(--muted-line); }
.astro-chart { display:grid; gap:3px; margin-block:8px; }
.astro-chart svg { width:100%; display:block; touch-action:pan-y; overflow:visible; }
.astro-chart .point { fill:var(--accent); stroke:var(--space-raised); stroke-width:1.5; }
.astro-chart .point[data-live=true] { fill:var(--device); }
.astro-chart .chart-hit { fill:transparent; cursor:crosshair; }
.astro-chart .chart-target:focus .point,.astro-chart .chart-target:hover .point { stroke:#fff; stroke-width:2.5; }
.astro-chart .chart-label,.astro-chart .chart-tooltip { min-height:20px; color:var(--ink-muted); font-size:13px; overflow-wrap:anywhere; }
.astro-chart .chart-tooltip { min-height:48px; padding:5px 8px; border-radius:7px; background:var(--scrim); }
.astro-app #source-history,.astro-app #crew-check-in { scroll-margin-top:12px; }
.astro-app[data-motion-paused=true] *, .astro-app[data-motion-paused=true] *::before, .astro-app[data-motion-paused=true] *::after {
  animation-play-state:paused!important; transition-duration:0ms!important; scroll-behavior:auto!important;
}
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }

}

<script>
(() => {
  const cv = document.getElementById('galaxy');
  const ctx = cv.getContext('2d');
  if (!ctx) return;

  // ===== SETTINGS: tweak these =====
  const CFG = {
    stars: (innerWidth < 800 || (navigator.hardwareConcurrency ?? 8) <= 4 || (navigator.deviceMemory ?? 8) <= 4) ? 12000 : 22000,      // galaxy particles (lower = faster on weak devices)
    inclination: 1.36,  // tilt in radians (0 = face-on, 1.5 = almost edge-on)
    roll: -0.5,        // rotation of the whole galaxy on screen
    speed: 1,          // rotation speed multiplier
    size: 1            // star size multiplier
  };
  const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
  const rnd = Math.random, TAU = Math.PI * 2;
  const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) * 1.2;
  const lerp = (a, b, t) => a + (b - a) * t;

  let W, H, DPR, R, bg;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 1.5);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    R = Math.max(W, H) * 0.95;
    bg = ctx.createRadialGradient(W * .52, H * .5, 0, W * .52, H * .5, Math.max(W, H) * .8);
    bg.addColorStop(0, '#0b1530'); bg.addColorStop(.6, '#050a1c'); bg.addColorStop(1, '#02030a');
  }
  resize();

  // ----- sprites -----
  function sprite(size, stops) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    stops.forEach(s => gr.addColorStop(s[0], s[1]));
    g.fillStyle = gr; g.fillRect(0, 0, size, size);
    return c;
  }
  const glow = (r, g, b) => sprite(64, [[0, `rgba(${r},${g},${b},1)`], [.12, `rgba(${r},${g},${b},.55)`], [.4, `rgba(${r},${g},${b},.12)`], [1, `rgba(${r},${g},${b},0)`]]);
  const haloBlue = sprite(256, [[0, 'rgba(100,135,230,.11)'], [.6, 'rgba(80,110,210,.05)'], [1, 'rgba(60,90,200,0)']]);
  const discWarm = sprite(256, [[0, 'rgba(255,212,165,.5)'], [.3, 'rgba(250,190,140,.4)'], [.55, 'rgba(228,168,135,.24)'], [.8, 'rgba(150,150,215,.09)'], [1, 'rgba(100,130,220,0)']]);
  const bulge = sprite(256, [[0, 'rgba(255,240,220,.9)'], [.18, 'rgba(255,215,165,.6)'], [.45, 'rgba(255,180,120,.24)'], [.75, 'rgba(240,150,110,.05)'], [1, 'rgba(240,150,110,0)']]);
  const hazeBlue = sprite(128, [[0, 'rgba(150,178,255,1)'], [.4, 'rgba(130,160,255,.35)'], [1, 'rgba(120,150,255,0)']]);
  const dustSpr = sprite(64, [[0, 'rgba(150,72,22,.9)'], [.5, 'rgba(150,72,22,.35)'], [1, 'rgba(150,72,22,0)']]);
  const G = { white: glow(255, 255, 255), blue: glow(120, 170, 255), orange: glow(255, 170, 90), red: glow(255, 110, 80), pale: glow(210, 225, 255) };

  // ----- galaxy structure: rings (like Andromeda) + bulge + smooth disc -----
  const RINGS = [0.42, 0.62, 0.84];
  const pickRing = () => { const u = rnd(); return u < .25 ? 0 : u < .65 ? 1 : 2; };
  const N = CFG.stars, NH = 900, TOT = N + NH;
  const pr = new Float32Array(TOT), pth = new Float32Array(TOT), pz = new Float32Array(TOT), psz = new Float32Array(TOT);
  const pcol = new Array(TOT);

  for (let i = 0; i < N; i++) {
    const u = rnd(); let r, z, bl = 0, sz = 0.6 + Math.pow(rnd(), 3) * 1.5, al = 0.15 + rnd() * 0.35;
    if (u < 0.16) { r = Math.abs(gauss()) * 0.14; z = gauss() * 0.09; al *= 0.6; }
    else if (u < 0.52) { r = 0.05 - Math.log(1 - rnd() * 0.97) * 0.38; if (r > 1.1) r = rnd(); z = gauss() * 0.02; }
    else { r = RINGS[pickRing()] + gauss() * 0.05; z = gauss() * 0.015; bl = 0.25; }
    const t = Math.min(r / 1.1 + bl, 1);
    let col = `rgba(${lerp(255, 150, t) | 0},${lerp(215, 185, t) | 0},${lerp(165, 255, t) | 0},${al})`;
    if (r > 0.3 && rnd() < 0.04) { col = 'rgba(195,218,255,.95)'; sz = 1.6 + rnd(); }
    pr[i] = r; pth[i] = rnd() * TAU; pz[i] = z; psz[i] = sz; pcol[i] = col;
  }
  // pink star-forming clumps (HII regions) just outside the dust lanes
  for (let c = 0; c < NH / 12; c++) {
    const rc = RINGS[pickRing()] + 0.02 + gauss() * 0.02, tc = rnd() * TAU;
    for (let k = 0; k < 12; k++) {
      const i = N + c * 12 + k;
      pr[i] = rc + gauss() * 0.01; pth[i] = tc + gauss() * 0.03; pz[i] = 0;
      psz[i] = 1.6 + rnd() * 2; pcol[i] = `rgba(255,${50 + (rnd() * 50) | 0},${110 + (rnd() * 50) | 0},.9)`;
    }
  }
  // dust: arcs hugging the inner edge of each ring (clumpy, filamentary)
  const D = 9000, dr = new Float32Array(D), dth = new Float32Array(D), dsz = new Float32Array(D);
  for (let c = 0; c < D / 40; c++) {
    const rc = RINGS[pickRing()] - 0.03 + gauss() * 0.02, tc = rnd() * TAU, len = 0.2 + rnd() * 0.7;
    for (let k = 0; k < 40; k++) {
      const i = c * 40 + k;
      dr[i] = rc + gauss() * 0.012; dth[i] = tc + (rnd() - 0.5) * len; dsz[i] = 0.012 + rnd() * 0.02;
    }
  }

  // ----- foreground stars with colors and diffraction spikes -----
  const pal = ['white', 'white', 'pale', 'blue', 'orange', 'orange', 'red'];
  const rgbOf = { white: '#fff', pale: '#dbe8ff', blue: '#9cc4ff', orange: '#ffbb80', red: '#ff9a7a' };
  const fg = Array.from({ length: 1100 }, (_, i) => {
    const k = pal[(rnd() * pal.length) | 0], big = i < 36;
    return { x: rnd(), y: rnd(), s: big ? 1.4 + rnd() * 1.8 : 0.5 + rnd() * 1.1, k, big, p: rnd() * 6.28, f: 0.5 + rnd() * 2, d: 0.2 + rnd() * 0.8 };
  });
  fg.push({ x: 0.085, y: 0.535, s: 4.5, k: 'blue', big: true, p: 0, f: 0.4, d: 0.5, halo: 0.13 });   // bright blue star with halo
  fg.push({ x: 0.135, y: 0.05, s: 3.5, k: 'orange', big: true, p: 1, f: 0.4, d: 0.5, vert: true });  // orange star, long spike

  let mx = 0, my = 0, ox = 0, oy = 0;
  addEventListener('pointermove', e => { mx = e.clientX / innerWidth - 0.5; my = e.clientY / innerHeight - 0.5; });

  let userPaused = false, paused = motionPreference.matches || document.hidden;
  let last = null, elapsed = 0, raf = null;
  function frame(timestamp) {
    raf = null;
    if (!paused && last !== null) elapsed += Math.min(50, timestamp - last);
    last = paused ? null : timestamp;
    const now = elapsed, t = now / 1000 * CFG.speed;
    if (!paused) { ox += (mx - ox) * 0.04; oy += (my - oy) * 0.04; }
    const inc = CFG.inclination + oy * 0.25, roll = CFG.roll + ox * 0.2;
    const ci = Math.cos(inc), si = Math.sin(inc), cr = Math.cos(roll), sr = Math.sin(roll);
    const cx = W * 0.52, cy = H * 0.5, spin = t * 0.06;
    const flat = ci * 0.95 + 0.1;
    const ell = (spr, w, f, alpha) => {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(roll); ctx.scale(1, f); ctx.globalAlpha = alpha;
      ctx.drawImage(spr, -w / 2, -w / 2, w, w); ctx.restore();
    };

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    // smooth light: blue halo, warm disc, bulge, companion galaxy
    ell(haloBlue, R * 2.6, flat, 1);
    ell(discWarm, R * 1.9, flat, 1);
    ell(bulge, R * 0.85, 0.6, 1);
    ctx.globalAlpha = 1;
    const mxp = cx - W * 0.29, myp = cy - H * 0.07, ms = W * 0.075;
    ctx.save(); ctx.translate(mxp, myp); ctx.scale(1, 0.8);
    ctx.drawImage(bulge, -ms / 2, -ms / 2, ms, ms); ctx.drawImage(G.orange, -ms / 6, -ms / 6, ms / 3, ms / 3); ctx.restore();

    // galaxy stars + pink regions
    ctx.globalAlpha = 0.55; const sc = CFG.size;
    for (let i = 0; i < TOT; i++) {
      const a = pth[i] + spin, r = pr[i];
      const x = r * Math.cos(a), y = r * Math.sin(a) * ci + pz[i] * si;
      const px = cx + (x * cr - y * sr) * R, py = cy + (x * sr + y * cr) * R;
      if (px < -5 || px > W + 5 || py < -5 || py > H + 5) continue;
      const s = psz[i] * sc; ctx.fillStyle = pcol[i];
      ctx.fillRect(px - s / 2, py - s / 2, s, s);
    }

    // dust lanes: strong on the near side (lower right), faint on the far side
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < D; i++) {
      const a = dth[i] + spin, r = dr[i];
      const x = r * Math.cos(a), y = r * Math.sin(a) * ci;
      const px = cx + (x * cr - y * sr) * R, py = cy + (x * sr + y * cr) * R, d = dsz[i] * R;
      if (px < -d || px > W + d || py < -d || py > H + d) continue;
      ctx.globalAlpha = y > 0 ? 0.085 : 0.03;
      ctx.drawImage(dustSpr, px - d / 2, py - d / 2, d, d);
    }

    // foreground stars
    ctx.globalCompositeOperation = 'lighter';
    for (const s of fg) {
      const x = ((s.x + ox * 0.02 * s.d + 1) % 1) * W, y = ((s.y + oy * 0.02 * s.d + 1) % 1) * H;
      const a = 0.65 + 0.35 * Math.sin(now / 1000 * s.f + s.p);
      ctx.globalAlpha = a; ctx.fillStyle = rgbOf[s.k];
      if (!s.big) { ctx.fillRect(x - s.s / 2, y - s.s / 2, s.s, s.s); continue; }
      const gs = s.s * 9;
      if (s.halo) { ctx.globalAlpha = 0.55; const hw = W * s.halo; ctx.drawImage(G.blue, x - hw / 2, y - hw / 2, hw, hw); ctx.globalAlpha = a; }
      ctx.drawImage(G[s.k], x - gs / 2, y - gs / 2, gs, gs);
      const L = s.s * (s.vert ? 22 : 10);
      ctx.globalAlpha = a * 0.1;
      for (let q = 1; q <= 3; q++) {
        const l = L / q;
        ctx.fillRect(x - l, y - 0.45, l * 2, 0.9);
        ctx.fillRect(x - 0.45, y - l * (s.vert ? 1.4 : 1), 0.9, l * (s.vert ? 2.8 : 2));
      }
      ctx.globalAlpha = a; ctx.fillRect(x - 1.2, y - 1.2, 2.4, 2.4);
    }
    if (!paused) raf = requestAnimationFrame(frame);
  }
  function updateMotion() {
    paused = userPaused || motionPreference.matches || document.hidden;
    last = null;
    if (paused && raf !== null) { cancelAnimationFrame(raf); raf = null; }
    if (!paused && raf === null) raf = requestAnimationFrame(frame);
  }
  document.addEventListener('astro-motion-change', event => { userPaused = Boolean(event.detail); updateMotion(); });
  document.addEventListener('visibilitychange', updateMotion);
  motionPreference.addEventListener('change', updateMotion);
  addEventListener('resize', () => {
    resize();
    if (paused) frame(performance.now());
  });
  frame(performance.now());
})();
</script>

function ReplayControls({ replay, playing, setPlaying, speed, setSpeed, measuring }) {
  const { run, clock, status, dataMode, scenarioId } = replay
  const start = Date.parse(run?.range_start)
  const end = Date.parse(run?.range_end)
  const span = Number.isFinite(end - start) ? Math.max(0, (end - start) / 1000) : 0
  const elapsed = Number.isFinite(Date.parse(clock) - start) ? Math.min(span, Math.max(0, (Date.parse(clock) - start) / 1000)) : 0
  const enabled = dataMode === 'integrated' && status !== 'error' && span > 0 && !measuring
  useEffect(() => {
    if (!playing) return
    if (!enabled || elapsed >= span) {
      setPlaying(false)
      return
    }
    if (status !== 'ready' || replay.state?.as_of !== clock) return
    const timer = window.setTimeout(() => {
      const next = new Date(start + 1000 * Math.min(span, elapsed + speed)).toISOString().replace('.000Z', 'Z')
      replay.seek(next)
    }, 1000)
    return () => window.clearTimeout(timer)
  }, [clock, elapsed, enabled, playing, replay.seek, replay.state, setPlaying, speed, span, start, status])
  const seek = (iso) => { setPlaying(false); replay.seek(iso) }
  return h(Fragment, null,
    h('section', { className: 'glass astro-controls', 'aria-label': 'Scenario and replay clock' },
      h('div', { className: 'astro-scenarios', role: 'group', 'aria-label': 'Scenario' },
        scenarios.map(([id, name, provenance]) => h('button', {
          key: id, type: 'button', className: 'astro-button', 'aria-pressed': scenarioId === id,
          onClick: () => { setPlaying(false); replay.setScenario(id) },
        }, name, h('small', null, provenance)))),
      h('div', { className: 'astro-clock' }, h('small', null, 'Replay clock'),
        clock ? h(UtcTime, { iso: clock }) : h('span', null, '—'))),
    h('section', { className: 'glass astro-transport', 'aria-label': 'Replay controls' },
      h('div', { className: 'astro-transport__row' },
        iconButton(playing ? 'Pause replay' : 'Play replay', {
          disabled: !enabled || (!playing && elapsed >= span), className: 'astro-button astro-primary',
          onClick: () => setPlaying(!playing),
        }),
        h('label', { className: 'secondary' }, 'Speed ', h('select', {
          value: speed, disabled: !enabled, onChange: (event) => setSpeed(Number(event.target.value)),
        }, [1, 10, 60, 300].map((rate) => h('option', { key: rate, value: rate }, rate + '×')))),
        h('input', { type: 'range', min: 0, max: span || 1, step: 1, value: elapsed, disabled: !enabled,
          'aria-label': 'Replay time', 'aria-valuetext': clock ? formatUtc(clock) : 'No active run',
          onChange: (event) => seek(new Date(start + Number(event.target.value) * 1000).toISOString().replace('.000Z', 'Z')),
        })),
      h('div', { className: 'astro-checkpoints', role: 'group', 'aria-label': 'Replay checkpoints' },
        CHECKPOINTS[scenarioId].map((checkpoint) => iconButton(checkpoint.label, {
          key: checkpoint.id, 'aria-pressed': clock === checkpoint.as_of, disabled: !enabled,
          onClick: () => seek(checkpoint.as_of),
        })),
        iconButton('Fresh run', { className: 'astro-button astro-reset', onClick: () => { setPlaying(false); replay.reset() } })),
      h('p', { className: 'secondary' }, dataMode === 'fixture-preview'
        ? 'Replay is off for the fixed preview snapshot.'
        : measuring ? 'Replay is paused during the local reaction check.'
          : 'Pick a checkpoint to move the replay clock. Only readings up to that time are used.')))
}

function DetectorComparison({ state }) {
  const byId = indexObservations(state.observations)
  const left = state.sources.find((source) => source.source_id === 'DosTel1')
  const right = state.sources.find((source) => source.source_id === 'DosTel2')
  const a = byId.get(left?.last_observation_id)
  const b = byId.get(right?.last_observation_id)
  const valid = a && b && a.metric === b.metric && a.unit === b.unit &&
    [a.value, b.value].every((v) => Number.isFinite(v) && v >= 0)
  const mean = valid ? (a.value + b.value) / 2 : 0
  const difference = valid ? (mean === 0 ? 0 : Math.abs(a.value - b.value) / mean * 100) : null
  const matched = valid && a.observed_at === b.observed_at && left.state === 'current' && right.state === 'current'
  const agrees = Boolean(matched && a.value === b.value)
  const conflict = left?.state === 'conflicting' || right?.state === 'conflicting'
  const agreement = conflict ? 'Conflicting evidence' : agrees ? 'In agreement · identical readings' : 'Agreement not assessed'
  return h('aside', { className: 'glass astro-comparison', 'aria-label': 'DosTel comparison', 'data-agrees': Boolean(agrees && !conflict) },
    h('h3', null, 'DosTel1 and DosTel2'),
    difference === null
      ? h('p', { className: 'secondary' }, 'Two comparable readings are needed to calculate a difference.')
      : h('p', null, h('strong', { title: 'Absolute difference divided by the mean of the two readings' }, difference.toFixed(1) + '% difference'),
        h('span', { className: 'secondary' }, ' · ', shortValue(a), ' vs ', shortValue(b), ' ', a.unit)),
    h('strong', { className: 'astro-agreement secondary' }, agreement),
    !conflict && !agrees && h('p', { className: 'secondary' }, !matched
      ? 'Agreement needs two current readings at the same UTC time.'
      : 'The readings differ. The prototype has no detector agreement tolerance.'))
}

function baselineBand(points) {
  const prefix = points[0].metric === 'sleep_duration' ? 'base-sleep-' : points[0].metric === 'reaction_time' ? 'base-reaction-' : null
  if (prefix === null) return null
  const baseline = [1,2,3,4,5].map((index) => points.find((point) => point.id === prefix + index && point.provenance === 'SYNTHETIC'))
  if (baseline.some((point) => !point)) return null
  const values = baseline.map((point) => point.value)
  return [Math.min(...values), Math.max(...values)]
}

function HistoryChart({ observations }) {
  const labelId = useId()
  const gradientId = useId()
  const tooltipId = useId()
  const ref = useRef(null)
  const pointRefs = useRef([])
  const [width, setWidth] = useState(320)
  const [hovered, setHovered] = useState(null)
  const [focused, setFocused] = useState(null)
  const [tabPoint, setTabPoint] = useState(0)
  useLayoutEffect(() => {
    const node = ref.current
    if (!node) return
    const measure = () => setWidth(Math.max(180, Math.round(node.getBoundingClientRect().width)))
    measure()
    const observer = new ResizeObserver(measure)
    observer.observe(node)
    return () => observer.disconnect()
  }, [])
  const points = observations.filter((row) => Number.isFinite(row.value) && Number.isFinite(Date.parse(row.observed_at)))
    .slice().sort((a,b) => Date.parse(a.observed_at) - Date.parse(b.observed_at) || a.id.localeCompare(b.id))
  if (!points.length) return null
  if (new Set(points.map((row) => row.unit)).size !== 1) return h('p', { className:'secondary', ref }, 'Different units are shown separately in the table.')
  const start = Date.parse(points[0].observed_at)
  const end = Date.parse(points.at(-1).observed_at)
  const band = baselineBand(points)
  const values = points.map((row) => row.value).concat(band ?? [])
  const min = Math.min(...values), max = Math.max(...values)
  const pad = max === min ? Math.max(1, Math.abs(max) * .08) : (max - min) * .16
  const low = Math.max(0, min - pad), high = max + pad
  const plotX = 47, plotR = width - 16, plotTop = 16, plotBase = 147
  const x = (time) => start === end ? (plotX + plotR) / 2 : plotX + (time-start) / (end-start) * (plotR-plotX)
  const y = (value) => plotBase - (value-low) / (high-low) * (plotBase-plotTop)
  const active = focused ?? hovered
  const selected = active === null ? null : points[active]
  const segments = []
  for (const row of points) {
    let segment = segments.at(-1)
    if (!segment || (dose(row) && Date.parse(row.observed_at) - Date.parse(segment.at(-1).observed_at) > 300000)) {
      segment = []
      segments.push(segment)
    }
    segment.push(row)
  }
  const lines = segments.filter((segment) => segment.length > 1).map((segment) => {
    const line = segment.map((row, i) => (i ? 'L' : 'M') + x(Date.parse(row.observed_at)) + ',' + y(row.value)).join(' ')
    return [line, line + ' L' + x(Date.parse(segment.at(-1).observed_at)) + ',' + plotBase +
      ' L' + x(Date.parse(segment[0].observed_at)) + ',' + plotBase + ' Z']
  })
  const timeLabel = (time) => {
    const iso = new Date(time).toISOString()
    return end-start >= 86400000 ? iso.slice(5,10) : iso.slice(11,19)
  }
  const ticks = start === end ? [start] : width >= 320 ? [start, start + Math.floor((end-start) / 2000) * 1000, end] : [start,end]
  const move = (event, index) => {
    const displacement = { ArrowLeft:-1, ArrowRight:1 }[event.key]
    const next = event.key === 'Home' ? 0 : event.key === 'End' ? points.length-1 : displacement === undefined ? null : Math.max(0,Math.min(points.length-1,index+displacement))
    if (next !== null) {
      event.preventDefault()
      pointRefs.current[next]?.focus({ preventScroll:true })
    }
  }
  return h('figure', { className:'astro-chart', ref, 'aria-labelledby':labelId },
    h('figcaption', { id:labelId }, points.length + (points.length === 1 ? ' recorded reading' : ' recorded readings') + ' · UTC',
      points.some((item) => item.provenance === 'LIVE_MEASURED') ? ' · copper dots: this device' : ''),
    h('div', { className:'chart-label' }, humanize(points[0].metric) + ' (' + points[0].unit + ')'),
    h('svg', { viewBox:'0 0 ' + width + ' 178', role:'group', 'aria-label':'History plot. Use left and right arrow keys to move between readings.' },
      h('defs', null, h('linearGradient', { id:gradientId, x1:0,x2:0,y1:0,y2:1 },
        h('stop', { offset:0, stopColor:'var(--accent)', stopOpacity:.32 }),
        h('stop', { offset:1, stopColor:'var(--accent)', stopOpacity:.03 }))),
      band && h('rect', { x:plotX, y:y(band[1]), width:plotR-plotX, height:Math.max(1,y(band[0])-y(band[1])),
        fill:'var(--synthetic)', opacity:.17 }),
      [high, (low+high)/2, low].map((value, i) => h('g', { key:i },
        h('line', { x1:plotX, x2:plotR, y1:y(value), y2:y(value), stroke:'var(--border)' }),
        h('text', { x:plotX-6, y:y(value)+4, textAnchor:'end', fill:'var(--ink-muted)', fontSize:13 }, Number(value.toPrecision(3))))),
      lines.map(([line, area], i) => h('g', { key:i },
        h('path', { d:area, fill:'url(#' + gradientId + ')' }),
        h('path', { d:line, fill:'none', stroke:'var(--accent)', strokeWidth:2.2, strokeLinejoin:'round' }))),
      [...new Set(ticks)].map((time, i) => h('g', { key:time },
        h('line', { x1:x(time),x2:x(time),y1:plotBase,y2:plotBase+5,stroke:'var(--border-strong)' }),
        h('text', { x:x(time), y:168, textAnchor:start === end ? 'middle' : i === 0 ? 'start' : time === end ? 'end' : 'middle',
          fill:'var(--ink-muted)', fontSize:13 }, timeLabel(time)))),
      points.map((row,i) => {
        const title = formatUtc(row.observed_at) + ' · ' + fullValue(row) + ' · ' + PROVENANCE_LABEL[row.provenance]
        return h('g', { key:row.id, className:'chart-target', role:'img', 'aria-label':title,
          'aria-describedby':i === active ? tooltipId : undefined,
          tabIndex:i === Math.min(tabPoint,points.length-1) ? 0 : -1, ref:(element) => { pointRefs.current[i] = element },
          onMouseEnter:() => setHovered(i), onMouseLeave:() => setHovered(null),
          onClick:(event) => event.currentTarget.focus(),
          onFocus:() => { setFocused(i); setTabPoint(i) }, onBlur:() => setFocused(null),
          onKeyDown:(event) => move(event,i) },
          h('title', null, title),
          h('circle', { className:'chart-hit', cx:x(Date.parse(row.observed_at)),cy:y(row.value),r:8 }),
          h('circle', { className:'point', cx:x(Date.parse(row.observed_at)),cy:y(row.value),r:points.length === 1 ? 6 : 3.6, 'data-live':row.provenance === 'LIVE_MEASURED' }))
      })),
    h('div', { id:tooltipId, role:'tooltip', className:'chart-tooltip' }, selected
      ? formatUtc(selected.observed_at) + ' · ' + fullValue(selected) + ' · ' + PROVENANCE_LABEL[selected.provenance]
      : points.length === 1 ? 'Single observation at ' + formatUtc(points[0].observed_at) : 'Hover over a point or focus the chart to see the exact reading.'),
    band && h('p', { className:'secondary' }, 'Shaded band: five seeded baseline readings, ' + band[0] + '–' + band[1] + ' ' + points[0].unit))
}


function History({ state, history, source, selected, select, clock, mode, retry }) {
  const rows = history.observations
  return h('section', { className:'glass', id:'source-history', tabIndex:-1, 'aria-labelledby':'history-title' },
    h('h2', { id:'history-title' }, 'Source history'),
    h('div', { className:'astro-actions', role:'group', 'aria-label':'History source' },
      state.sources.map((item) => iconButton(sourceName(item.source_id), {
        key:item.source_id, 'aria-pressed':selected === item.source_id, onClick:() => select(item.source_id,false),
      }))),
    history.status === 'loading' && h(StateMessage, { kind:'loading' }, 'Loading history…'),
    history.status === 'error' && h(StateMessage, { kind:'error', onRetry:retry }, history.error ?? 'History could not be loaded.'),
    history.status === 'ready' && (rows.length === 0
      ? h('p', { className:'ui-empty' }, 'No stored observations for ', source?.source_id, ' up to ', formatTime(clock), '.',
        mode === 'fixture-preview' && ' A fixture preview run holds no stored history.')
      : h(Fragment, null,
        h(HistoryChart, { observations:rows, key:source?.source_id }),
        h('details', { className:'astro-table-details' },
          h('summary', null, 'View data table ', h('span', { className:'secondary' }, rows.length + (rows.length === 1 ? ' row' : ' rows'))),
          h('div', { className:'ui-table-wrap', tabIndex:0, 'aria-label':'Source history table' },
            h('table', { className:'ui-table' },
              h('thead', null, h('tr', null, ['Time (UTC)','Value','Provenance'].map((head) => h('th', { scope:'col', key:head }, head)))),
              h('tbody', null, rows.map((row) => h('tr', { key:row.id },
                h('td', null, h(UtcTime, { iso:row.observed_at })),
                h('td', { className:'mono', title:fullValue(row) }, formatValue(row)),
                h('td', null, h(ProvenanceBadge, { provenance:row.provenance })))))))))))
}

function Why({ state, open, close }) {
  const observations = indexObservations(state?.observations ?? [])
  const section = (title, element) => h('section', { 'aria-label':title }, h('h3', null,title), element)
  return h(Drawer, { open, title:'Why? Evidence', onClose:close },
    !state || !state.assessments.length ? h('p', { className:'ui-empty' }, state
      ? 'No assessment was returned for this time.' : 'No state is loaded for the current clock.')
      : state.assessments.map((item) => h('div', { key:item.id, className:'astro-stack' },
        h('p', null, h('strong', null, item.title), ' ',
          h('code', { className:'ui-rule' }, item.rule_id + '@' + item.rule_version), ' at ', h(UtcTime, { iso:state.as_of })),
        section('Supporting evidence', h(EvidenceList, { items:item.supporting_evidence, observations, emptyText:'No supporting evidence returned.' })),
        section('Conflicting evidence', h(EvidenceList, { items:item.conflicting_evidence, observations, emptyText:'No conflicting evidence returned.' })),
        section('Missing inputs', h(MissingInputs, { inputs:item.missing_inputs })))),
    h('p', { className:'secondary' }, 'Evidence text, states and rule IDs are returned by the engine. Thresholds are prototype settings, not clinical cutoffs.'))
}

function Incidents({ incidents }) {
  return h('details', { className:'glass astro-incidents' },

      : h('span', { className:'secondary' }, 'No incidents')),
    incidents.length
      ? h('ul', { className:'ui-incidents' }, incidents.map((incident) => h(IncidentRow, { key:incident.id, incident })))
      : h('p', { className:'ui-empty' }, 'No incidents at this time.'))
}

function Brand({ paused }) {
  const svg = document.querySelector('#astro-logo').textContent.trim()
  const still = document.querySelector('#astro-logo-still').textContent.trim()
  const href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(paused ? still : svg)
  return h('div', { className:'astro-brand astro-heading-scrim' },
    h('img', { src:href, width:40, height:40, alt:'' }),
    h('div', null, h('h1', null, 'Astro Vital'), h('p', null, 'Evidence for the next decision.')))
}

function AstroApp() {
  const replay = useReplay('radlab_stale')
  const { run, state, clock, dataMode } = replay
  const [measuring, setMeasuring] = useState(false)
  const [playing, setPlaying] = useState(false)
  const [speed, setSpeed] = useState(60)
  const motion = useAmbientMotion(measuring)
  const [evidenceOpen, setEvidenceOpen] = useState(false)
  const [historySourceId, setHistorySourceId] = useState(null)
  const [historyAttempt, setHistoryAttempt] = useState(0)
  const checkInRef = useRef(null)
  const activeRun = useRef(null)
  activeRun.current = run?.run_id ?? null
  const sources = state?.sources ?? []
  const selected = sources.find((source) => source.source_id === historySourceId) ?? sources[0]
  const history = useSourceHistory(run, state ? clock : '', selected?.source_id ?? null, selected?.metric ?? null, historyAttempt, state)
  useEffect(() => {
    setEvidenceOpen(false)
    setHistorySourceId(null)
    setPlaying(false)
  }, [run?.run_id])
  useEffect(() => {
    document.dispatchEvent(new CustomEvent('astro-motion-change', { detail:motion.paused }))
  }, [motion.paused])
  const focusSection = (element) => {
    element?.scrollIntoView({ block:'start', behavior:motion.paused ? 'auto' : 'smooth' })
    element?.focus({ preventScroll:true })
  }
  const select = (id, focus = true) => {
    setHistorySourceId(id)
    if (focus) focusSection(document.getElementById('source-history'))
  }
  const onWhy = () => { setPlaying(false); setEvidenceOpen(true) }
  const onAction = (id) => {
    const route = routeAction(id)
    if (route === 'evidence') onWhy()
    if (route === 'history') focusSection(document.getElementById('source-history'))
    if (route === 'checkin') {
      setPlaying(false)
      const section = checkInRef.current
      focusSection(section)
      const action = state?.actions.find((item) => item.id === id && item.available)
      if (!section || !action) return
      const task = section.querySelector('.crew-checkin__reaction-task h3')
      if (task) {
        task.focus({ preventScroll:true })
      } else {
        const button = Array.from(section.querySelectorAll('.crew-checkin__reaction button:not(:disabled)'))
          .find((entry) => entry.textContent.trim() === action.label)
        button?.click()
      }
    }
  }
  const { refresh } = replay
  const onSubmit = useCallback(async (submission) => {
    if (!run) throw new Error('No active run.')
    const result = await submitObservations(run.run_id, submission)
    if (activeRun.current === run.run_id) refresh()
    return result
  }, [run, refresh])
  const observationIndex = indexObservations(state?.observations ?? [])
  const actionIds = new Set(state?.assessments.flatMap((item) => item.action_ids) ?? [])
  const otherActions = state?.actions.filter((action) => !actionIds.has(action.id)) ?? []
  const crew = replay.scenarioId === 'sleep_vigilance'
  const reaction = state?.actions.find((action) => action.id === 'start_reaction_check')
  return h('div', { className:'astro-app', 'data-motion-paused':motion.paused },
    h('a', { className:'astro-skip', href:'#main' }, 'Skip to dashboard'),
    h('header', { className:'astro-header' },
      h(Brand, { paused:motion.paused }),
      h('div', { className:'astro-tools' },
        h('div', { className:'astro-mode', role:'group', 'aria-label':'Replay and connection status' },
          h('span', null, 'Replay prototype'), h(DataModeBadge, { mode:dataMode })),
        iconButton(motion.label, { className:'astro-button astro-motion', disabled:motion.locked,
          'aria-pressed':motion.paused, onClick:motion.toggle }))),
    h('main', { id:'main', className:'astro-main', tabIndex:-1 },
      h(ReplayControls, { replay, playing, setPlaying, speed, setSpeed, measuring }),
      dataMode === 'fixture-preview' && state && h('div', { className:'astro-note', role:'note' },
        h('strong', null, 'Fixture preview. '), 'This is the contract example, a fixed snapshot at ',
        h(UtcTime, { iso:state.as_of }), '. It is not engine output and cannot be replayed. The checkpoints activate once this run holds stored observations.'),
      h('div', { className:'glass astro-banner' },
        replay.status === 'error' ? h(StateMessage, { kind:'error', onRetry:replay.retry },
          replay.error ?? 'The state could not be loaded.', clock ? ' No state is shown for ' + formatUtc(clock) + '.' : '')
        : !state ? h(StateMessage, { kind:'loading' }, 'Loading state', clock ? ' at ' + formatUtc(clock) : '', '…')
        : state.assessments.length ? state.assessments.map((item) => h(Assessment, { key:item.id, item, actions:state.actions, onAction, onWhy }))
        : h(StateMessage, { kind:'empty' }, 'No assessment was returned for this time.')),
      state && h('div', { className:'astro-grid' },
        h('section', { className:'astro-readings', 'aria-labelledby':'sources-title' },
          h('h2', { id:'sources-title' }, 'Sources and latest readings'),
          sources.length ? sources.map((source) => h(SourceReading, { key:source.source_id,
            source, reading:observationIndex.get(source.last_observation_id), selected:source.source_id === selected?.source_id,
            onHistory:() => select(source.source_id), action:source.source_id === 'reaction_task' ? reaction : null, onAction }))
            : h(StateMessage, { kind:'empty' }, 'No sources were returned.')),
        crew ? h(CrewFigure, { selected:selected?.source_id, select, onAction, onWhy, actions:state.actions })
          : h(Cabin, { state, selected:selected?.source_id, select }),
        h('div', { className:'astro-side' },
          h(History, { state, history, source:selected, selected:selected?.source_id, select, clock, mode:dataMode,
            retry:() => setHistoryAttempt((n) => n+1) }),
          h(EvidenceStatusPanel, { compact:true, state, dataMode, status:replay.status, onAction, onOpenEvidence:onWhy }),
          h(Incidents, { incidents:state.incidents }))),
      otherActions.length > 0 && h('section', { className:'glass', 'aria-labelledby':'other-actions-title' },
        h('h2', { id:'other-actions-title' }, 'Other actions'),
        h('div', { className:'astro-actions' }, otherActions.map((action) => h(ActionButton, { key:action.id, action, onAction })))),
      crew && run?.scenario_id === 'sleep_vigilance' && h('div', { id:'crew-check-in', ref:checkInRef, tabIndex:-1, 'aria-label':'Crew check-in' },
        h(CrewCheckIn, { key:run.run_id, run, scenarioId:run.scenario_id, missionTime:clock, actions:state?.actions ?? [],
          onTaskActiveChange:setMeasuring, onSubmit, onAction })),
      h(Why, { state, open:evidenceOpen, close:() => setEvidenceOpen(false) })),
    h('footer', { className:'astro-footer astro-heading-scrim' }, h('span', null, 'Astro Vital · Space Apps prototype'),
      h('span', null, 'Explainable replay. Not a medical device.')))
}

const gallery = new URLSearchParams(window.location.search).has('gallery')
createRoot(document.querySelector('#root')).render(h(gallery ? Gallery : AstroApp))
</script>
