<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Heart-planets mark">
  <defs>
    <linearGradient id="heart-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCE9FF" />
      <stop offset=".42" stop-color="#6BA1FF" />
      <stop offset="1" stop-color="#2F6FE0" />
    </linearGradient>
    <radialGradient id="planet-cyan" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#E4FAFF" />
      <stop offset="1" stop-color="#5BC8E8" />
    </radialGradient>
    <radialGradient id="planet-violet" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#F0E9FF" />
      <stop offset="1" stop-color="#A58BFF" />
    </radialGradient>
    <filter id="logo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#9DBEFF" stroke-width="1.6" opacity=".85">
    <ellipse cx="32" cy="32.5" rx="28" ry="11.2" transform="rotate(-26 32 32.5)" />
  </g>
  <g filter="url(#logo-glow)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 32 32.5" to="360 32 32.5" dur="22s" repeatCount="indefinite" />
      <circle cx="59" cy="20.5" r="3.8" fill="url(#planet-cyan)" />
      <circle cx="5" cy="41" r="2.6" fill="url(#planet-violet)" />
    </g>
    <path d="M32 52c-.4-.3-13.7-7.8-17.9-15.2-3.1-5.5-1.4-12.1 4-14.4 3.9-1.7 8.2-.3 10.8 3.1l1.1 1.5 1.1-1.5c2.6-3.4 6.9-4.8 10.8-3.1 5.4 2.3 7.1 8.9 4 14.4C45.7 44.2 32.4 51.7 32 52Z" fill="url(#heart-blue)" stroke="#DCE9FF" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M23 27.8c1.3-2.2 3.8-3 5.9-2.3" fill="none" stroke="#F4F8FF" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="32" cy="33" r="2" fill="#F4F8FF">
      <animate attributeName="opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
