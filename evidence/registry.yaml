  - id: EVID_FLUID_001
    title: "Cephalad fluid shift and plasma volume loss drive cardiovascular adaptation"
    domain: [cardiovascular, fluid_shift]
    metrics: [heart_rate, systolic_bp, hrv]
    context_features: [flight_duration, fluid_status]
    relationship:
      type: physiological_mechanism
      direction:
        weightlessness: increase
        cephalad_fluid_shift: increase
        plasma_volume: decrease
    fact: >
      The NASA cardiovascular evidence report states that weightlessness produces a headward fluid
      shift and a reduction in blood and plasma volume. Stroke volume and cardiac output initially
      increase, then plasma volume decreases. Postflight, astronauts show reduced stroke volume and
      altered heart rate and blood pressure responses to standing.
    interpretation: >
      Fluid status is a mechanism connecting spaceflight exposure to heart rate, blood pressure, and
      orthostatic responses. It is not directly measured by routine wearable sensors, so it should
      be treated as context rather than inferred.
    prototype_rule_note: >
      Use flight duration and postflight timing as context. Do not infer fluid status from a single
      heart-rate value.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Cardiovascular Adaptations Contributing to Cardiovascular Disease or Events (Cardio Risk EB 2022)"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Cardio%20Risk%20EB%202022%20FINAL_4-3-2023.pdf"
      publication_date: "2023-04-03"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Physiological adaptation sections, report pp. 11-18"
    evidence_strength:
      level: STRONG
      rationale: "Well-established spaceflight physiology with convergent evidence."
    population:
      context: "Astronauts"
      size: "Multiple studies"
      duration: "Short- and long-duration spaceflight"
    thresholds: []
    limitations:
      - "Mechanistic, not a measured variable in the monitoring system"
      - "Individual variation"
      - "Countermeasures affect fluid status"
    system_use:
