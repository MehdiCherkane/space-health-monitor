  - id: EVID_TEMP_002
    title: "Thermal discomfort outside the performance zone can reduce performance"
    domain: [thermal, performance]
    metrics: [cabin_temperature, relative_humidity, reaction_time]
    relationship:
      type: standard_rationale
      direction:
        thermal_discomfort: increase
        performance: decrease
    fact: >
      The NASA-STD-3001 Volume 2 rationale states that operations outside the Crew Health
      Environmental Limits may cause dry, stuffy, or irritated mucous membranes, skin rashes from
      microbial growth at high humidity, thermal discomfort, and decreased performance. It defines
      the Crew Performance Environmental Zone as the range in which humans can achieve thermal
      comfort and routine activities are not affected by thermal stress, and states that operating
      outside this zone will cause performance decrements and impact productivity.
    interpretation: >
      Thermal stress is a plausible environmental contributor to performance change, but the
      standard's rationale is not a dose-response study. It supports context, not a diagnosis.
    prototype_rule_note: >
      Combine cabin conditions with the astronaut's thermal comfort report and performance trend.
      Do not attribute a performance change to temperature without that context.
