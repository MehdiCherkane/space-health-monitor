        - "individual CO2 threshold"
    status:
      recommended_for_mvp: true
      quality_flags: [NASA_STANDARD, ENVIRONMENTAL]

  - id: EVID_CO2_002
    title: "Cabin CO2 is associated with headache reports on ISS"
    domain: [co2, headache, environmental_health]
    metrics: [cabin_co2, fatigue]
    context_features: [headache_report, 7_day_average]
    relationship:
      type: association
      direction:
        cabin_co2: increase
        headache: increase
    fact: >
      The NASA OCHMO CO2 technical brief states that 19 of 49 astronauts reported headaches
      (approximately 38.7%) and that a retrospective analysis found 46 days with reported headaches
      and 1,670 days of non-reports. It states that to keep the risk of headache below 1%, the
      average 7-day CO2 needs to be maintained below 2.5 mmHg (the current ISS range is 1-9 mmHg,
      and the NASA-STD-3001 requirement is <3 mmHg). Headaches have been reported at levels between
      2.8 and 4.5 mmHg, with worsening fatigue and malaise above 4.5 mmHg.
    interpretation: >
      CO2 is a plausible contributor to headache in crewed habitats. The association is stronger
      for headache than for cognitive impairment. A headache report plus elevated 7-day CO2 is
      meaningful converging evidence.
    prototype_rule_note: >
      Combine headache report with the 7-day average cabin ppCO2. If CO2 is elevated, raise an
      environmental concern and suggest reviewing ventilation; do not diagnose a CO2 toxicity.
    source:
      organization: NASA
      title: "Carbon Dioxide (CO2) Technical Brief, OCHMO-TB-004, Rev B"
      url: "https://www.nasa.gov/wp-content/uploads/2023/03/co2-technical-brief-ochmo.pdf"
      publication_date: "2022-11-10"
      source_type: NASA_TECHNICAL_BRIEF
      location: "CO2-Induced Headaches section; Key Historical CO2 Concentrations"
    evidence_strength:
      level: STRONG
      rationale: "NASA operational data and retrospective ISS analysis; observational association, not causal proof."
    population:
      context: "ISS astronauts"
      size: "49 astronauts; 46 headache days and 1,670 non-report days"
      duration: "7-day average CO2 exposure; retrospective records"
    thresholds:
      - metric: cabin_co2
        value: 2.5
        unit: mmHg
        averaging_window: "7_day"
        context: "predicted probability of headache below 1%"
        population: "ISS crewmembers"
        source: "NASA OCHMO CO2 Technical Brief, citing Law et al. 2014"
      - metric: cabin_co2
        value: 2.8
        unit: mmHg
        averaging_window: "not reported (exposure level at which headaches were reported)"
        context: "lower bound of reported headache range"
        population: "crewmembers in habitats"
        source: "NASA OCHMO CO2 Technical Brief, NASA/TP-2010-216126"
      - metric: cabin_co2
        value: 4.5
        unit: mmHg
        averaging_window: "not reported (exposure level at which headaches were reported)"
        context: "upper bound of reported headache range; worsening fatigue and malaise above this level"
        population: "crewmembers in habitats"
        source: "NASA OCHMO CO2 Technical Brief, NASA/TP-2010-216126"
    limitations:
      - "Observational and retrospective"
      - "Headache reports are self-reported and may be incomplete"
      - "CO2 exposure is correlated with other cabin conditions"
      - "Individual susceptibility varies"
    system_use:
      candidate_hypotheses: [H02]
      supports:
        - "CO2 plus headache is a plausible environmental relationship"
        - "7-day averaging is the appropriate window"
      weakens:
        - "a single CO2 reading explains a headache"
      must_not_be_used_as:
        - "standalone diagnosis"
        - "proof of causation"
    status:
      recommended_for_mvp: true
      quality_flags: [OBSERVATIONAL, SELF_REPORT]

  - id: EVID_CO2_003
    title: "Cognitive effects of spacecraft-level CO2 are conflicting and not established"
    domain: [co2, cognition, environmental_health]
    metrics: [cabin_co2, reaction_time, mental_fatigue]
    relationship:
      type: mixed_evidence
      direction:
        cabin_co2: increase
        cognition: uncertain
    fact: >
      The NASA OCHMO CO2 technical brief states that prior research offers conflicting data on CO2
      exposure and cognitive functioning, including memory, concentration, decision-making, and task
      performance. It reports that several recent terrestrial studies at levels currently
      maintained onboard spacecraft and submarines did not reduce cognition or performance in
      astronaut-like subjects or submarine officers. It cites Scully et al. (2019), Rodehe et al.
      (2018), and Basner et al. (2017, SPACECOT), each reporting no significant CO2 effect on their
      cognitive outcomes. In SPACECOT, the only significant time-in-CO2 effects were physical
      exhaustion and mental fatigue, which increased with exposure duration.
    interpretation: >
      Do not encode CO2 -> cognitive impairment as a strong relationship. CO2 may contribute to
      fatigue, malaise, and headache, but a cognitive decrement at spacecraft-level CO2 is not
      established.
    prototype_rule_note: >
      If CO2 is elevated and cognition is degraded, treat CO2 as one possible contributor and
      request confirmation. Do not present it as a proven cause.
    source:
      organization: NASA
      title: "Carbon Dioxide (CO2) Technical Brief, OCHMO-TB-004, Rev B"
      url: "https://www.nasa.gov/wp-content/uploads/2023/03/co2-technical-brief-ochmo.pdf"
      publication_date: "2022-11-10"
      source_type: NASA_TECHNICAL_BRIEF
      location: "Effects of CO2 on Cognitive Functioning"
    evidence_strength:
      level: MODERATE
      rationale: "Deliberately mixed evidence; recent controlled studies find no cognitive effect at spacecraft levels."
    population:
      context: "Astronaut-like subjects, submarine officers, and head-down-tilt subjects"
      size: "Multiple studies; exact N not stated in the brief"
      duration: "Hours to days of exposure"
    thresholds: []
    limitations:
      - "Conflicting literature"
      - "Terrestrial analogs may not capture spaceflight stressors"
      - "Cognitive batteries differ across studies"
      - "SPACECOT found fatigue effects, not cognitive effects"
    system_use:
      candidate_hypotheses: [H02]
      supports:
        - "CO2 may contribute to fatigue/malaise"
      weakens:
        - "CO2 at spacecraft levels causes cognitive impairment"
      must_not_be_used_as:
        - "standalone diagnosis"
        - "proof of CO2-induced cognitive degradation"
    status:
      recommended_for_mvp: true
      quality_flags: [MIXED_EVIDENCE, DO_NOT_OVERSTATE]

  - id: EVID_CO2_004
    title: "Historical reports link higher CO2 to fatigue, poor sleep, and mucosal symptoms"
    domain: [co2, sleep, symptoms]
    metrics: [cabin_co2, fatigue, sleep_duration]
    context_features: [symptom_report]
    relationship:
