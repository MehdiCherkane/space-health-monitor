  - id: EVID_BMED_002
    title: "Behavioral emergencies are rare in LEO; subclinical mood and anxiety disturbances occur"
    domain: [behavioral_health, mood, stress]
    metrics: [mood, stress, fatigue]
    relationship:
      type: epidemiology
      direction:
        mission_duration: increase
        behavioral_health_risk: increase
    fact: >
      The NASA BMed evidence report states that the average incidence rate of an adverse
      behavioral health event during a space mission is relatively low for current missions of
      up to 6 months in low Earth orbit. Although subclinical mood and anxiety disturbances have
      occurred, no behavioral emergencies have been reported to date. The report also states
      that as of 2016 the IMM indicated no astronaut had been officially diagnosed with anxiety
      or depression during flight.
    interpretation: >
      Base rates are low, so a positive behavioral signal is more likely to reflect a
      subclinical, transient, or contextual state than a psychiatric emergency. Conversely, low
      base rates make false positives costly and demand careful confirmation.
    prototype_rule_note: >
      Keep behavioral health hypotheses at "concern" level. Require repeated observations,
      functional impact, and human review before escalation.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Adverse Cognitive or Behavioral Changes and Psychiatric Disorders Leading to In-Mission Health and Performance and Long-Term Health Effects"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/HRP-ER-BMED-HFBP-20250210.pdf"
      publication_date: "2025-02-10"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Executive Summary / Occurrences of Behavioral Health Signs and Symptoms; Mood and Mood Disorders"
    evidence_strength:
      level: STRONG
      rationale: "NASA human-spaceflight epidemiology and clinical surveillance; low base rate is consistently reported."
    population:
      context: "US astronauts on Shuttle and ISS missions up to about 6 months"
      size: "Multiple cohorts; see EVID_BMED_003 for counts"
      duration: "Up to 6 months LEO"
    thresholds: []
    limitations:
