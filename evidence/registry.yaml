  - id: EVID_RAD_001
    title: "NASA career effective dose limit is 600 mSv, corresponding to 3% mean REID"
    domain: [radiation]
    metrics: [cumulative_radiation_dose, radiation_dose_rate]
    relationship:
      type: standard
      direction:
        cumulative_radiation_dose: increase
        cancer_risk: increase
    fact: >
      NASA-STD-3001 Volume 1 Revision C requirement [V1 4030] states that an individual
      crewmember's total career effective radiation dose due to spaceflight radiation exposure shall
      be less than 600 mSv. The limit is universal for all ages and sexes. The standard states that
      the total career dose limit is based on ensuring each crewmember remains below a 3% mean risk
      of cancer mortality (risk of exposure-induced death, REID) above the non-exposed baseline mean.
    interpretation: >
      Provides a defensible cumulative-exposure standard. It is a career limit, not an acute
      clinical alarm, and it does not predict an individual's actual cancer outcome.
    prototype_rule_note: >
      Track cumulative dose against the 600 mSv career limit and flag when the remaining margin is
      low. Do not convert dose into an individual diagnosis.
    source:
      organization: NASA
      title: "NASA Space Flight Human-System Standard, Volume 1: Crew Health, Revision C"
      url: "https://standards.nasa.gov/sites/default/files/standards/NASA/C/nasa-std-3001-vol-1-rev-c-signature.pdf"
      publication_date: "2023-09-29"
      source_type: NASA_STANDARD
      location: "Requirement [V1 4030], report pp. 42-43"
    evidence_strength:
      level: VERY_STRONG
      rationale: "NASA technical standard with an explicit career limit and a stated risk basis."
    population:
      context: "NASA crewmembers"
      size: "Not applicable (standard)"
      duration: "Career cumulative exposure"
    thresholds:
      - metric: cumulative_radiation_dose
        value: 600
        unit: mSv
        averaging_window: "career total"
        context: "total career effective dose due to spaceflight radiation exposure; universal for all ages and sexes"
        population: "NASA crewmembers"
        source: "NASA-STD-3001 Vol 1 Rev C [V1 4030]"
    limitations:
      - "Career limit, not an acute exposure threshold"
      - "Effective dose is a modeled quantity with uncertainty"
      - "Individual risk varies"
      - "Not a clinical diagnostic threshold"
    system_use:
      candidate_hypotheses: [H06]
      supports:
        - "cumulative radiation dose is a legitimate long-term concern"
      weakens:
        - "a single dose reading predicts an individual cancer outcome"
      must_not_be_used_as:
