    metrics: [mood, reaction_time]
    relationship:
      type: clinical_association
      direction:
        mood: decline
        cognition: worsening
    fact: >
      The NASA BMed evidence report states that cognitive decrements are widely associated with
      depression, and describes major depressive disorder as the most common clinical mood
      disorder associated with persistent negative affective states in DSM-5. The report also
      notes that clinical disorders such as anxiety, post-traumatic stress, and sleep
      loss/insomnia can affect mood and performance.
