  - id: EVID_HR_001
    title: "Heart rate and blood pressure are context-dependent across flight phases"
    domain: [cardiovascular, heart_rate, blood_pressure]
    metrics: [heart_rate, systolic_bp, diastolic_bp]
    context_features: [posture, flight_phase, activity_level]
    relationship:
      type: physiological_adaptation
      direction:
        flight_phase: context_dependent
        heart_rate: context_dependent
        blood_pressure: context_dependent
    fact: >
      The NASA cardiovascular evidence report describes Shuttle studies in which inflight heart
      rate and systolic and diastolic blood pressure were decreased compared with preflight values.
      On re-entry, these values increased past their preflight baseline, reaching maximal values at
      peak gravity. After landing, standing produced significant decreases in systolic and
      diastolic pressure relative to seated values. Systolic pressure and heart rate returned to
      preflight values within an hour of landing, while most other cardiovascular changes reversed
      within a week.
    interpretation: >
      A heart rate or blood pressure value cannot be interpreted without flight phase, posture, and
      activity context. A value that would be abnormal at rest may be expected during re-entry or
      exercise, and a value that looks normal at rest may mask orthostatic intolerance on standing.
    prototype_rule_note: >
      Tag every cardiovascular observation with flight phase, posture, and activity. Compare with
      the astronaut's own values in the same context. Do not use a single context-free threshold.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Cardiovascular Adaptations Contributing to Cardiovascular Disease or Events (Cardio Risk EB 2022)"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Cardio%20Risk%20EB%202022%20FINAL_4-3-2023.pdf"
      publication_date: "2023-04-03"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Extended Duration Orbiter Medical Project section, report p. 15"
    evidence_strength:
      level: STRONG
      rationale: "NASA human-spaceflight evidence with repeated measurements across flight phases; group-level findings."
    population:
      context: "US Space Shuttle astronauts"
      size: "EDOMP cohort; exact N not stated in the cited passage"
      duration: "Shuttle missions"
    thresholds: []
    limitations:
      - "Group-level data; individual variation"
      - "Measurement conditions differ across phases"
      - "Countermeasures and G-suits affect responses"
    system_use:
      candidate_hypotheses: [H04]
      supports:
        - "heart rate and blood pressure require context tagging"
        - "postflight orthostatic change is expected"
      weakens:
        - "a universal context-free heart-rate or blood-pressure threshold is valid"
      must_not_be_used_as:
        - "standalone diagnosis"
    status:
      recommended_for_mvp: true
      quality_flags: [OBSERVATIONAL, CONTEXT_DEPENDENT]

  - id: EVID_HR_002
    title: "No validated astronaut-specific resting-HR alarm threshold; exercise HR differs from resting HR"
    domain: [cardiovascular, heart_rate, exercise]
    metrics: [heart_rate, activity_level, exercise_duration]
    context_features: [posture, exercise_intensity, flight_phase]
    relationship:
      type: interpretation_constraint
      direction:
        activity_level: increase
        heart_rate: increase
    fact: >
      The NASA cardiovascular and fitness evidence reports quantify heart-rate changes during
      spaceflight, re-entry, standing, and exercise testing, but neither report establishes a
      single resting-heart-rate cutoff for clinical concern applicable to astronauts. The reports
      describe heart rate as a response to posture, gravity, fluid status, and exercise workload,
      and they evaluate exercise capacity using VO2peak, ventilatory threshold, and submaximal
      exercise responses rather than a resting-HR alarm.
    interpretation: >
      A high heart rate during exercise is not equivalent to persistent high heart rate at rest.
      Monitoring should distinguish the two by activity context and require persistence at rest
      before raising a cardiovascular concern.
    prototype_rule_note: >
      Only evaluate a resting-HR concern when activity level is low or unknown-but-stable, the
      elevation persists across repeated measurements, and it is a change from the astronaut's
      personal baseline. Never convert an exercise HR into a resting alarm.
    source:
      organization: NASA
      title: "Cardio Risk Evidence Report 2022; Risk of Impaired Performance Due to Reduced Muscle Mass, Strength & Endurance (Muscle) and Aerobic Capacity"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Cardio%20Risk%20EB%202022%20FINAL_4-3-2023.pdf"
      additional_urls:
        - "https://humanresearchroadmap.nasa.gov/Evidence/reports/Evidence%20report%20aerobic%20and%20muscle_FINAL%204-3-2024.pdf"
      publication_date: "2023-04-03; 2024-04-03"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Cardio report: heart rate and blood pressure during spaceflight; Fitness report: exercise testing and conclusions"
    evidence_strength:
      level: MODERATE
      rationale: "Explicit constraint derived from two NASA reports; the absence of a threshold is a document-level observation, not a trial result."
    population:
      context: "Astronauts"
      size: "Multiple NASA cohorts"
      duration: "Shuttle and ISS missions"
    thresholds: []
    limitations:
      - "Absence of a published threshold does not mean any value is safe"
      - "Clinical judgment still required"
      - "Exercise intensity is often estimated, not measured"
    system_use:
      candidate_hypotheses: [H04]
      supports:
        - "activity context is required before interpreting heart rate"
        - "persistent resting elevation is more concerning than exercise elevation"
      weakens:
        - "a single high heart rate is sufficient to raise a cardiovascular concern"
      must_not_be_used_as:
        - "standalone diagnosis"
        - "exercise restriction"
    status:
      recommended_for_mvp: true
      quality_flags: [INTERPRETATION_CONSTRAINT, NO_VALIDATED_THRESHOLD]

  - id: EVID_HR_003
    title: "Postflight orthostatic intolerance is common after long-duration spaceflight"
    domain: [cardiovascular, orthostatic, heart_rate, blood_pressure]
    metrics: [heart_rate, systolic_bp, diastolic_bp]
    context_features: [posture_change, tilt_test, flight_duration]
    relationship:
      type: human_spaceflight_finding
      direction:
        flight_duration: increase
        orthostatic_intolerance: increase
    fact: >
      The NASA cardiovascular evidence report states that the incidence of post-spaceflight
      orthostatic intolerance among US astronauts increased to greater than 80% on landing day
      following long-duration (4 to 6 month) Mir spaceflights, and five of six astronauts could not
      complete a 10-minute tilt test after Mir missions. In a later review, 4 of 6 (66%) ISS
      astronauts were unable to complete a 10-minute 80-degree head-up tilt test on landing day,
      compared with 13 of 66 (20%) Shuttle astronauts. Rates declined quickly: eight of nine ISS
      astronauts completed the tilt test on R+1, and by R+3, 13 of 15 (87%) ISS and 19 of 19 (100%)
      Shuttle astronauts completed the test.
    interpretation: >
      Orthostatic intolerance is a common, usually transient postflight response. It is best
      assessed with a controlled orthostatic test, not with a resting heart rate alone. A normal
      resting value does not exclude it.
    prototype_rule_note: >
      If orthostatic symptom or posture data are available, prompt a controlled repeat measurement
      and human review. Do not infer orthostatic intolerance from a resting HR trend.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Cardiovascular Adaptations Contributing to Cardiovascular Disease or Events (Cardio Risk EB 2022)"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Cardio%20Risk%20EB%202022%20FINAL_4-3-2023.pdf"
      publication_date: "2023-04-03"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Post-flight Risk: Orthostatic Intolerance, report pp. 17-18"
    evidence_strength:
      level: STRONG
      rationale: "Repeated NASA human-spaceflight findings across Mir, ISS, and Shuttle cohorts; small samples but consistent direction."
    population:
      context: "US astronauts and Mir crewmembers"
      size: "6 Mir astronauts; 6 ISS and 66 Shuttle astronauts in the tilt-test review; 9 ISS and 19 Shuttle on R+3"
      duration: "4-6 month Mir missions; ISS and Shuttle missions"
    thresholds: []
    limitations:
      - "Small samples in some comparisons"
      - "Tilt-test protocols and countermeasures vary"
      - "Landing-day testing conditions are not standardized across eras"
    system_use:
      candidate_hypotheses: [H04]
      supports:
        - "postflight orthostatic concern is plausible and common"
        - "controlled orthostatic testing is the appropriate confirmation"
      weakens:
        - "resting heart rate alone can rule out orthostatic intolerance"
      must_not_be_used_as:
        - "standalone diagnosis"
    status:
      recommended_for_mvp: true
      quality_flags: [HUMAN_SPACEFLIGHT, SMALL_SAMPLE]

  - id: EVID_BP_001
    title: "Consensus definition of orthostatic hypotension"
    domain: [cardiovascular, blood_pressure]
    metrics: [systolic_bp, diastolic_bp]
    context_features: [posture_change, tilt_test]
    relationship:
      type: consensus_definition
      direction:
        posture_change: standing
        systolic_bp: decrease
        diastolic_bp: decrease
    fact: >
      The international consensus statement defines orthostatic hypotension as a sustained
      reduction of systolic blood pressure by at least 20 mmHg or diastolic blood pressure by at
      least 10 mmHg within 3 minutes of standing or head-up tilt to at least 60 degrees.
    interpretation: >
      Provides a measurement-defined event that can be used when a controlled orthostatic test is
      performed. It is not a spontaneous-monitoring threshold and requires a known posture change
      and timed readings.
    prototype_rule_note: >
      Only apply this definition when posture, timing, and repeated BP readings are available.
      Otherwise request the missing measurements.
    source:
      organization: Clinical Autonomic Research (consensus statement)
      title: "Consensus statement on the definition of orthostatic hypotension, neurally mediated syncope and the postural tachycardia syndrome"
      url: "https://doi.org/10.1007/s10286-011-0119-5"
      publication_date: "2011-04"
      source_type: PEER_REVIEWED_LITERATURE
      location: "Definition section; PMID 21431947"
    evidence_strength:
      level: VERY_STRONG
      rationale: "International consensus definition; widely adopted and measurement-specific."
    population:
      context: "Adults, clinical autonomic testing"
      size: "Consensus expert panel"
      duration: "Within 3 minutes of posture change"
    thresholds:
      - metric: systolic_bp
        value: -20
        unit: mmHg
        averaging_window: "within 3 min of standing or head-up tilt >=60 deg"
        context: "sustained reduction from baseline"
        population: "adults undergoing orthostatic testing"
        source: "Freeman et al. 2011, Clin Auton Res"
      - metric: diastolic_bp
        value: -10
        unit: mmHg
        averaging_window: "within 3 min of standing or head-up tilt >=60 deg"
        context: "sustained reduction from baseline"
        population: "adults undergoing orthostatic testing"
        source: "Freeman et al. 2011, Clin Auton Res"
    limitations:
      - "Requires a controlled posture change and timed measurements"
      - "Not validated for spontaneous wearable monitoring"
      - "Different thresholds may apply in specific populations"
    system_use:
      candidate_hypotheses: [H04]
      supports:
        - "a precise orthostatic event definition is available"
      weakens:
        - "any BP drop is orthostatic hypotension"
      must_not_be_used_as:
