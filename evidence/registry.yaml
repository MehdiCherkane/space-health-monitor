  - id: EVID_BASELINE_001
    title: "LSAH conducts career-long, individually tailored surveillance"
    domain: [longitudinal_baseline, occupational_health]
    metrics: []
    context_features: [personal_baseline, clinical_surveillance]
    relationship:
      type: surveillance_program
      direction:
        longitudinal_surveillance: enabled
    fact: >
      NASA's Lifetime Surveillance of Astronaut Health (LSAH) screens and monitors astronauts for
      occupationally related injury or disease, examines acute and chronic morbidity and mortality,
      defines and analyzes health risks associated with occupational exposures, and designs
      individually tailored medical examinations and surveillance for particular outcomes. Its
      intent is to detect potential health problems at an early stage and prevent the development or
      progression of occupationally related conditions.
    interpretation: >
      Supports longitudinal, individually tailored monitoring rather than one-time population
      screening. It is the strongest program-level justification for change-from-personal-baseline.
    prototype_rule_note: >
      Prefer within-person change over population ranges. Preserve the date, context, and method of
      each baseline measurement.
    source:
      organization: NASA
