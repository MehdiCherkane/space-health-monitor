  - id: EVID_COG_003
    title: "NASA Reaction Self Test: operational precedent for brief repeated PVT on ISS"
    domain: [cognition, sleep, fatigue]
    metrics: [reaction_time, reaction_lapses]
    context_features: [false_starts, time_since_wake, work_hours, eva]
    relationship:
      type: operational_precedent
      direction:
        fatigue_exposure: increase
        reaction_time: worsening
    fact: >
      NASA's Reaction Self Test (RST) used a 3-minute PVT plus 2 minutes of activity questions,
      administered twice daily on ISS Expeditions 21 and 22, with feedback on a 0-100% scale
      relative to astronaut norms. The project description lists study hypotheses that RST
      performance would decline after wake durations >16 hours, sleep restricted to <6 hours
      per day for 3 or more days, sleep shifts, work periods >12 hours per day, more than 6
      work days without a rest day, and EVAs. The source is a project description/poster, not a
      results paper; the hypotheses are not reported outcomes.
    interpretation: >
      Provides an operational precedent for a brief, repeated, self-administered PVT and for
      collecting sleep/workload context alongside it. The numeric triggers are study hypotheses
      and must not be presented as validated thresholds.
    prototype_rule_note: >
      Adopt the pattern (brief test + context questions + personal trend), not the unverified
      numeric triggers.
    source:
      organization: NASA
      title: "Psychomotor Vigilance Self Test on ISS (Reaction Self Test on Expeditions 21 & 22)"
      url: "https://ntrs.nasa.gov/api/citations/20090029851/downloads/20090029851.pdf"
      publication_date: "2009"
      source_type: NASA_TECHNICAL_REPORT
      location: "Objectives and Hypotheses; Measurements"
    evidence_strength:
