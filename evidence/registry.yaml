  - id: EVID_SLEEP_001
    title: "Historical survey: about 6 h sleep in space versus 7.9 h terrestrially"
    domain: [sleep, circadian]
    metrics: [sleep_duration]
    relationship:
      type: descriptive_comparison
      direction:
        sleep_duration: lower_in_space
    fact: >
      A NASA Human Research Program evidence report cites the Santy et al. (1988)
      survey, which reported that astronauts averaged about 6 hours of sleep per day
      in space compared with about 7.9 hours terrestrially. The same report states that
      sleep was most reduced on the first and last mission days (5.6 h and 5.7 h), that
      many crewmembers reported fewer than 5 h on some nights, and that some slept
      two hours or less.
    interpretation: >
      Supports the possibility that an individual astronaut's sleep duration may fall
      materially below their terrestrial baseline during a mission. The estimate is old,
      survey-based, and predates current ISS operations, so it should not be treated as
      the expected in-flight mean or as an individual threshold.
    prototype_rule_note: >
      Use sleep duration only as a trend against the astronaut's own baseline. Do not
      encode "6 h" as an impairment cutoff.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Sleep.pdf"
      publication_date: "2016-04-11"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Sleep Duration section (report p. 7 and figure discussion)"
    evidence_strength:
      level: MODERATE
      rationale: "Historical self-report survey cited by NASA; not a direct actigraphy measurement of current crews."
    population:
      context: "US astronauts, Space Shuttle era and earlier"
      size: "Survey cohort; exact N not stated in the cited passage"
      duration: "Mission-length exposures"
    thresholds: []
    limitations:
      - "Self-report and survey design"
      - "Old data; operations and schedules have changed"
      - "Terrestrial comparison group may not be a true personal baseline"
      - "Does not establish individual impairment"
    system_use:
      candidate_hypotheses: [H01]
      supports:
        - "sleep duration can be reduced in spaceflight"
      weakens:
        - "population sleep norms are adequate substitutes for personal baseline"
      must_not_be_used_as:
        - "standalone diagnosis"
        - "absolute impairment threshold"
    status:
      recommended_for_mvp: true
      quality_flags: [HISTORICAL, SURVEY_DATA]

  - id: EVID_SLEEP_002
    title: "Actigraphy: in-flight sleep is modestly shorter than preflight and postflight sleep"
    domain: [sleep, circadian]
    metrics: [sleep_duration, sleep_efficiency]
    relationship:
      type: observational_comparison
      direction:
        sleep_duration: lower_in_flight
    fact: >
      Barger et al. (2014), using actigraphy and sleep logs over ten years of Shuttle and
      ISS operations, found that Shuttle astronauts averaged about 20 minutes less sleep
      in space than during a two-week preflight period and about 47 minutes less than
      during the week after landing. ISS astronauts averaged about 19 minutes less sleep
      in flight than during a two-week pre-mission period and about 52 minutes less than
      during the first week after landing. The NASA report describes this as the largest
      sleep study in space.
    interpretation: >
      On a group-average basis, in-flight sleep is only modestly shorter than preflight
      sleep, but the average conceals nights with much shorter sleep. A population mean
      of about 6 h is not a valid individual threshold, and a small group difference does
      not mean an individual is rested.
    prototype_rule_note: >
      Compare each night to the astronaut's rolling personal baseline and flag
      sustained downward trends, not a single night below a population number.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload (citing Barger et al. 2014)"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Sleep.pdf"
      publication_date: "2016-04-11"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Sleep Duration section"
    evidence_strength:
      level: STRONG
      rationale: "Large multi-year actigraphy dataset in astronauts, peer-reviewed and cited by NASA; group-level finding."
    population:
      context: "Space Shuttle and ISS astronauts"
      size: "Ten years of actigraphy and sleep logs; exact N not stated in the cited passage"
      duration: "Shuttle missions and ISS expeditions"
    thresholds: []
    limitations:
      - "Actigraphy can misclassify quiet wake as sleep"
      - "Sleep logs are subjective"
      - "Preflight training period may not represent a true baseline"
      - "Group averages do not quantify individual risk"
    system_use:
      candidate_hypotheses: [H01]
      supports:
        - "in-flight sleep duration is often below terrestrial sleep"
        - "personal baseline is more informative than a population mean"
      weakens:
        - "a fixed 6 h cutoff is a validated individual impairment threshold"
      must_not_be_used_as:
        - "standalone diagnosis"
        - "absolute impairment threshold"
    status:
      recommended_for_mvp: true
      quality_flags: [OBSERVATIONAL, ACTIGRAPHY]

  - id: EVID_SLEEP_003
    title: "Chronic sleep restriction degrades performance while subjective sleepiness plateaus"
    domain: [sleep, cognition, fatigue]
    metrics: [sleep_duration, reaction_time, reaction_lapses, fatigue]
    relationship:
      type: experimental_dose_response
      direction:
        sleep_duration: decrease
        reaction_time: worsening
        reaction_lapses: increase
    fact: >
      In controlled laboratory studies cited by the NASA sleep evidence report, healthy
      adults restricted to 4, 6, or 8 hours of time in bed per night showed steadily
      degrading performance, while their subjective feeling of sleepiness increased only
      modestly and then reached a plateau (Belenky et al. 2003; Van Dongen et al. 2003).
      The report concludes that most people cannot accurately gauge how much sleep loss
      affects their performance.
    interpretation: >
      Subjective fatigue or sleepiness can underestimate objective impairment. An
      objective reaction-time trend, especially lapses, is more informative than
      self-report alone when assessing fatigue-related performance degradation.
    prototype_rule_note: >
      When sleep is chronically short, require an objective reaction-time check before
      treating a normal self-report as reassuring. Escalate to human review if the
      objective trend worsens.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Sleep.pdf"
      publication_date: "2016-04-11"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Chronic Sleep Loss section, report p. 7"
    evidence_strength:
      level: STRONG
      rationale: "Converging controlled laboratory dose-response studies cited by NASA; not specific to astronauts."
    population:
      context: "Healthy adult laboratory volunteers"
      size: "Multiple studies; exact combined N not stated in the cited passage"
      duration: "Days to weeks of restricted sleep"
    thresholds: []
    limitations:
      - "Terrestrial laboratory setting"
      - "Sleep restriction schedules may not match mission schedules"
      - "Individual vulnerability varies"
      - "Performance tests differ across studies"
    system_use:
      candidate_hypotheses: [H01]
      supports:
        - "sleep deficit may increase concern"
        - "reaction-time degradation strengthens concern"
        - "normal self-reported sleepiness does not exclude impairment"
      weakens:
        - "self-reported fatigue is sufficient to rule out fatigue-related degradation"
      must_not_be_used_as:
        - "standalone diagnosis"
        - "absolute impairment threshold"
    status:
      recommended_for_mvp: true
      quality_flags: [EXPERIMENTAL, TERRESTRIAL]

  - id: EVID_SLEEP_004
    title: "Extended wakefulness produces reaction-time decrements equivalent to alcohol intoxication"
    domain: [sleep, cognition, fatigue]
    metrics: [sleep_duration, reaction_time, reaction_lapses]
    context_features: [time_since_wake]
    relationship:
      type: experimental_dose_response
      direction:
        time_since_wake: increase
        reaction_time: worsening
    fact: >
      The NASA sleep evidence report states that sustained wakefulness of only 19 hours
      can produce performance decrements equivalent to a blood alcohol concentration of
      0.05%, and that 24 hours of wakefulness can produce decrements on a simple reaction
      time task equivalent to a blood alcohol concentration of 0.10% (Dawson and Reid
      1997, as cited).
    interpretation: >
      Time since wake is a meaningful fatigue exposure. It can contextualize a reaction-time
      result even when measured sleep duration looks adequate.
    prototype_rule_note: >
      Add time-since-wake to the context of every reaction-time assessment. Do not turn the
      19 h or 24 h figures into an impairment diagnosis.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Sleep.pdf"
      publication_date: "2016-04-11"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Acute Sleep Loss section, report p. 7"
    evidence_strength:
      level: STRONG
      rationale: "Classic controlled study of extended wakefulness, cited by NASA; converging with broader fatigue literature."
    population:
      context: "Healthy adult laboratory volunteers"
      size: "Controlled study; exact N not stated in the cited passage"
      duration: "19-24 hours of sustained wakefulness"
    thresholds: []
    limitations:
      - "Blood-alcohol equivalence is an analogy, not a clinical diagnosis"
      - "Simple reaction-time task"
      - "Individual tolerance varies"
    system_use:
      candidate_hypotheses: [H01]
      supports:
        - "extended wakefulness is a fatigue exposure"
        - "time since wake should be recorded with cognitive tests"
      weakens:
