  - id: EVID_DATA_001
    title: "FDIR: fault detection, isolation, recovery, and redundancy are distinct functions"
    domain: [sensor_reliability, data_quality, engineering]
    metrics: []
    context_features: [fault_detection, fault_isolation, recovery, redundancy]
    relationship:
      type: engineering_principle
      direction:
        fault: increase
        system_degradation: increase
    fact: >
      NASA-HDBK-1002 defines failure detection, fault isolation, failure recovery, and redundancy as
      distinct functions. Fault management includes detection, isolation, diagnosis, response, and
      recovery. Redundancy includes hardware redundancy as well as functional, analytic, and
      information redundancy.
    interpretation: >
      Data quality and health state must be represented separately. A sensor fault is a system
      state, not a physiological state; a missing value is not evidence of a health change.
    prototype_rule_note: >
      Model data quality as its own layer with explicit states (valid, suspect, stale, missing,
      disagreeing). Health hypotheses consume only validated observations.
    source:
      organization: NASA
      title: "NASA Fault Management Handbook (NASA-HDBK-1002)"
      url: "https://www.nasa.gov/wp-content/uploads/2015/04/636372main_nasa-hdbk-1002_draft.pdf"
      publication_date: "2012-04-09"
      source_type: NASA_ENGINEERING_HANDBOOK
      location: "Definitions; redundancy philosophy; fault management functions"
    evidence_strength:
      level: VERY_STRONG
      rationale: "NASA engineering handbook; directly applicable system-design principle."
    population:
      context: "NASA space systems"
      size: "Not applicable (handbook)"
      duration: "System lifecycle"
    thresholds: []
    limitations:
      - "Engineering guidance, not medical evidence"
      - "Implementation-specific"
    system_use:
      candidate_hypotheses: [H08, H09]
      supports:
        - "data quality must be a separate layer"
        - "fault handling is distinct from health reasoning"
      weakens:
        - "missing or suspect data can be treated as a health observation"
      must_not_be_used_as:
        - "standalone diagnosis"
    status:
      recommended_for_mvp: true
      quality_flags: [ENGINEERING_PRINCIPLE, SCOPE_CRITICAL]

  - id: EVID_DATA_002
    title: "Fault management requires traceability and root-cause analysis"
    domain: [sensor_reliability, data_quality, engineering]
    metrics: []
    context_features: [telemetry_traceability, root_cause]
    relationship:
      type: engineering_principle
      direction:
        traceability: increase
        diagnostic_confidence: increase
    fact: >
      NASA-HDBK-1002 describes fault management as including detection, isolation, diagnosis,
      response, and recovery, and emphasizes that telemetry and fault-management data must support
      traceability and root-cause analysis. The handbook addresses verification and validation of
      fault-management functions, including the use of failure scenarios and a validation matrix.
    interpretation: >
      Every health hypothesis should be traceable to observations, transformations, and evidence
      records. Without traceability, a confident-looking output cannot be audited or corrected.
    prototype_rule_note: >
      Store the evidence path for every hypothesis: raw observation -> validation -> derived
      feature -> evidence record -> hypothesis -> action. Keep the path reproducible.
    source:
      organization: NASA
      title: "NASA Fault Management Handbook (NASA-HDBK-1002)"
      url: "https://www.nasa.gov/wp-content/uploads/2015/04/636372main_nasa-hdbk-1002_draft.pdf"
      publication_date: "2012-04-09"
      source_type: NASA_ENGINEERING_HANDBOOK
      location: "Fault management functions; verification and validation"
    evidence_strength:
      level: STRONG
      rationale: "NASA engineering handbook guidance; directly applicable to an auditable reasoning system."
    population:
      context: "NASA space systems"
      size: "Not applicable (handbook)"
      duration: "System lifecycle"
    thresholds: []
    limitations:
      - "Engineering guidance, not a clinical validation"
    system_use:
      candidate_hypotheses: [H08, H09]
      supports:
        - "traceable evidence paths are required"
      weakens:
        - "an unexplained confidence score is acceptable"
      must_not_be_used_as:
        - "standalone diagnosis"
    status:
      recommended_for_mvp: true
      quality_flags: [ENGINEERING_PRINCIPLE]

  - id: EVID_DATA_003
    title: "Missing or stale data should degrade confidence, not imply a health state"
    domain: [data_quality, missing_data]
    metrics: []
    context_features: [data_age, missingness, staleness]
    relationship:
      type: interpretation_constraint
      direction:
        data_missing: increase
        assessment_confidence: decrease
    fact: >
      NASA-HDBK-1002 treats fault detection, isolation, and recovery as separate functions and
      requires telemetry that supports traceability and root-cause analysis. In that framework,
      missing, stale, or invalid data are data-quality states that require a system response; they
      are not measurements of the monitored process.
    interpretation: >
      A missing health measurement should produce an "insufficient data" evidence state and a
      measurement request. It should not be interpreted as a normal or abnormal physiological value.
    prototype_rule_note: >
      H09 (insufficient data) should be the default when required observations are missing, stale,
      or invalid. Request the missing measurement explicitly.
    source:
      organization: NASA
      title: "NASA Fault Management Handbook (NASA-HDBK-1002)"
      url: "https://www.nasa.gov/wp-content/uploads/2015/04/636372main_nasa-hdbk-1002_draft.pdf"
      publication_date: "2012-04-09"
      source_type: NASA_ENGINEERING_HANDBOOK
      location: "Fault detection and isolation; telemetry traceability"
    evidence_strength:
      level: STRONG
      rationale: "Direct application of NASA fault-management principles to data quality; not a clinical study."
    population:
      context: "NASA space systems"
      size: "Not applicable (handbook)"
      duration: "System lifecycle"
    thresholds: []
    limitations:
      - "Engineering principle, not a medical rule"
      - "Staleness limits are implementation-specific"
    system_use:
      candidate_hypotheses: [H08, H09]
      supports:
        - "missing data is a data-quality state"
        - "insufficient data is a legitimate hypothesis state"
      weakens:
        - "missing data can be treated as normal"
        - "missing data can be treated as abnormal"
      must_not_be_used_as:
        - "standalone diagnosis"
    status:
      recommended_for_mvp: true
      quality_flags: [ENGINEERING_PRINCIPLE, SCOPE_CRITICAL]

  - id: EVID_DATA_004
    title: "Redundant sensors and information redundancy support disagreement resolution"
    domain: [sensor_reliability, data_quality]
    metrics: []
    context_features: [sensor_agreement, redundancy, cross_check]
    relationship:
      type: engineering_principle
      direction:
        redundancy: increase
        fault_isolation: increase
    fact: >
      NASA-HDBK-1002 describes hardware redundancy as well as functional, analytic, and information
      redundancy. It states that redundancy supports fault isolation and that redundancy management
      is part of fault management. The handbook also addresses the need to verify that fault
      responses are valid and do not introduce unnecessary or invalid responses.
    interpretation: >
      When two sensors disagree, the disagreement is itself evidence of a data-quality problem. The
      system should isolate the likely faulty source before using either value for a health
      hypothesis.
    prototype_rule_note: >
      Implement a disagreement state. If sensors disagree beyond their stated accuracy, mark the
      observation suspect and request a third measurement or a manual check.
    source:
      organization: NASA
      title: "NASA Fault Management Handbook (NASA-HDBK-1002)"
      url: "https://www.nasa.gov/wp-content/uploads/2015/04/636372main_nasa-hdbk-1002_draft.pdf"
      publication_date: "2012-04-09"
      source_type: NASA_ENGINEERING_HANDBOOK
      location: "Redundancy philosophy; fault isolation"
    evidence_strength:
      level: STRONG
      rationale: "NASA engineering handbook; directly applicable to multi-sensor validation."
    population:
      context: "NASA space systems"
      size: "Not applicable (handbook)"
      duration: "System lifecycle"
    thresholds: []
    limitations:
      - "Engineering guidance, not a validated medical sensor-fusion algorithm"
    system_use:
      candidate_hypotheses: [H08]
      supports:
        - "sensor disagreement is a data-quality signal"
        - "redundancy supports fault isolation"
      weakens:
        - "one of two disagreeing sensors must be the physiological truth"
      must_not_be_used_as:
        - "standalone diagnosis"
    status:
      recommended_for_mvp: true
      quality_flags: [ENGINEERING_PRINCIPLE]

