  - id: EVID_SLEEP_005
    title: "Circadian phase and misalignment affect alertness and cognitive performance"
    domain: [sleep, circadian, cognition]
    metrics: [sleep_duration, reaction_time, fatigue]
    context_features: [circadian_phase, schedule_shift]
    relationship:
      type: physiological_association
      direction:
        circadian_misalignment: increase
        reaction_time: worsening
    fact: >
      The NASA sleep evidence report states that alertness and performance fluctuate with
      a circadian rhythm, with performance worst when the circadian drive to sleep is
      strongest. It defines circadian misalignment as attempting sleep and wakefulness at
      times opposed by the circadian system, notes that jet lag is a common example, and
      states that engaging in activities during adverse circadian phases significantly
      impairs cognitive performance. Non-24-hour operations during spaceflight have also
      been associated with sleep problems.
    interpretation: >
      Time of day and recent schedule shifts are required context for interpreting sleep
      and reaction time. A poor reaction-time result at 04:00 may reflect circadian phase
      rather than a new medical problem.
    prototype_rule_note: >
      Record mission time, sleep/wake schedule, and recent shifts with every assessment.
      Prefer change-from-personal-baseline at the same circadian phase.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Sleep.pdf"
      publication_date: "2016-04-11"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Circadian Phase section, report p. 7; non-24-hour operations section"
    evidence_strength:
      level: MODERATE
      rationale: "Strong terrestrial circadian physiology; spaceflight-specific evidence is limited and largely observational."
    population:
      context: "Laboratory volunteers and astronauts"
      size: "Multiple studies; exact N not stated in the cited passage"
      duration: "Circadian-cycle and mission-duration exposures"
    thresholds: []
    limitations:
      - "Circadian phase was not directly measured by the monitoring system"
      - "Spaceflight-specific evidence is limited"
      - "Individual chronotype varies"
    system_use:
