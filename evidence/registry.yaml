  - id: EVID_RAD_003
    title: "Galactic cosmic radiation dose rate is about 1.5 mSv/day unshielded"
    domain: [radiation, space_weather]
    metrics: [radiation_dose_rate, cumulative_radiation_dose]
    relationship:
      type: physical_environment
      direction:
        gcr_exposure: increase
        cumulative_radiation_dose: increase
    fact: >
      NASA-STD-3001 Volume 1 Revision C states that the unshielded galactic cosmic radiation (GCR)
      effective dose rate is about 1.5 mSv/day, and that shielding of 10-40 g/cm2 reduces this to
      about 1.3 mSv/day or lower. The standard also notes that effective dose per mission day varies
      with the solar cycle.
    interpretation: >
      GCR is a continuous background exposure. It provides a baseline for interpreting cumulative
      dose, but it does not predict an acute event or an individual outcome.
    prototype_rule_note: >
      Use mission duration and shielding context to interpret cumulative dose. Do not treat the
      average rate as a measured individual dose.
    source:
      organization: NASA
      title: "NASA Space Flight Human-System Standard, Volume 1: Crew Health, Revision C"
      url: "https://standards.nasa.gov/sites/default/files/standards/NASA/C/nasa-std-3001-vol-1-rev-c-signature.pdf"
      publication_date: "2023-09-29"
      source_type: NASA_STANDARD
      location: "GCR dose-rate discussion, report p. 45; Figure 4.8-1"
    evidence_strength:
      level: STRONG
      rationale: "NASA standard's modeled physical environment; dose rates are estimates with uncertainty."
    population:
      context: "Spaceflight radiation environment"
      size: "Not applicable (physical model)"
      duration: "Per mission day"
