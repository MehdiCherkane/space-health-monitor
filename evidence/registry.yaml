  - id: EVID_RAD_002
    title: "NASA organ-specific career and short-term radiation limits"
    domain: [radiation]
    metrics: [cumulative_radiation_dose]
    context_features: [organ_specific_dose]
    relationship:
      type: standard
      direction:
        organ_dose: increase
        non_cancer_risk: increase
    fact: >
      NASA-STD-3001 Volume 1 Revision C, Table 4.8-1, specifies dose limits for non-cancer effects
      over 30-day, 1-year, and career windows. Career limits are lens 4,000 mGy-Eq, skin 6,000
      mGy-Eq, circulatory system 1,000 mGy-Eq, and CNS 1,500 mGy. Blood-forming organs have no
      career limit but are capped at 250 mGy-Eq per 30 days and 500 mGy-Eq per year. CNS limits are
      calculated at the hippocampus, and a separate CNS limit applies to particles with Z >= 10
      (100 mGy per year, 250 mGy career).
    interpretation: >
      Radiation risk is not only a single career effective-dose number; organ-specific limits matter
      for lens, skin, circulatory, and CNS outcomes. These are design and surveillance limits, not
      wearable alarms.
    prototype_rule_note: >
      If organ-dose data are available, track them separately. Do not collapse all radiation risk
      into one number.
    source:
      organization: NASA
      title: "NASA Space Flight Human-System Standard, Volume 1: Crew Health, Revision C"
      url: "https://standards.nasa.gov/sites/default/files/standards/NASA/C/nasa-std-3001-vol-1-rev-c-signature.pdf"
