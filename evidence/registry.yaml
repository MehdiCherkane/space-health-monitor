  - id: EVID_BODYTEMP_001
    title: "Normal body temperature depends on measurement site and age"
    domain: [body_temperature, clinical_reference]
    metrics: [body_temperature]
    context_features: [measurement_site, age]
    relationship:
      type: normative_range
      direction:
        measurement_site: context_dependent
        body_temperature: context_dependent
    fact: >
      A systematic review of 36 articles (9,227 measurement sites from 7,636 subjects) calculated
      mean +/- 2 standard deviations ranges of 36.32-37.76 degrees C (rectal), 35.76-37.52 degrees C
      (tympanic), 35.61-37.61 degrees C (urine), 35.73-37.41 degrees C (oral), and 35.01-36.93
      degrees C (axillary). Adults aged 60 and older had a temperature 0.23 degrees C lower on
      average than younger adults. The authors conclude that measurement site and age are the most
      important patient factors.
    interpretation: >
      There is no single universal normal or fever threshold. A body-temperature reading must be
      interpreted with its measurement site, device, and the astronaut's personal baseline.
    prototype_rule_note: >
      Store the measurement site and device with every temperature. Prefer change-from-personal-
      baseline and repeat measurement over a fixed cutoff.
    source:
      organization: Open Forum Infectious Diseases (peer-reviewed systematic review)
      title: "Normal Body Temperature: A Systematic Review"
      url: "https://doi.org/10.1093/ofid/ofz032"
