      quality_flags: [CONSENSUS_DEFINITION, MEASUREMENT_DEPENDENT]

  - id: EVID_BP_002
    title: "Presyncopal astronauts differ in baseline blood pressure and vascular resistance"
    domain: [cardiovascular, blood_pressure]
    metrics: [systolic_bp, diastolic_bp, heart_rate]
    context_features: [presyncope, tilt_test]
    relationship:
      type: association
      direction:
        baseline_bp: lower
        presyncope: more_likely
    fact: >
      The NASA cardiovascular evidence report describes a mechanistic study in which astronauts who
      did not become presyncopal on landing day had a greater norepinephrine response upon standing
      and greater peripheral vascular resistance. Analysis of preflight data showed normal
      cardiovascular measures in both groups, but the presyncopal group was characterized by lower
      diastolic and systolic blood pressure and peripheral vascular resistance when supine. Plasma
      volume losses were not significantly different between groups. Increased heart rate, decreased
      systolic pressure, and reduced stroke volume were observed in 14 astronauts during a
      post-spaceflight 5-minute stand test.
    interpretation: >
      Baseline cardiovascular differences may modulate orthostatic risk, but the finding is
      group-level and not a stand-alone predictor. It supports using personal baseline and a
      controlled stand test rather than a population cutoff.
    prototype_rule_note: >
      Compare preflight and postflight orthostatic responses when available. Do not use baseline BP
      alone to predict presyncope.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Cardiovascular Adaptations Contributing to Cardiovascular Disease or Events (Cardio Risk EB 2022)"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Cardio%20Risk%20EB%202022%20FINAL_4-3-2023.pdf"
      publication_date: "2023-04-03"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Mechanistic studies of post-spaceflight orthostatic hypotension, report p. 17"
    evidence_strength:
      level: MODERATE
      rationale: "Small mechanistic study; group-level difference; not a validated individual predictor."
    population:
      context: "US astronauts"
      size: "14 astronauts in the stand test; presyncopal vs non-presyncopal groups"
      duration: "Postflight landing day"
    thresholds: []
    limitations:
      - "Small sample"
      - "Group-level analysis"
      - "Plasma volume and countermeasures vary"
    system_use:
      candidate_hypotheses: [H04]
      supports:
        - "personal baseline and orthostatic testing are informative"
      weakens:
        - "baseline BP alone predicts presyncope"
      must_not_be_used_as:
        - "standalone diagnosis"
        - "individual risk prediction"
    status:
      recommended_for_mvp: false
      quality_flags: [SMALL_SAMPLE, GROUP_LEVEL]

  - id: EVID_HRV_001
    title: "HRV components have different interpretations; LF/HF is controversial"
    domain: [cardiovascular, hrv]
    metrics: [hrv, heart_rate]
    context_features: [posture, respiration, activity_level]
    relationship:
      type: measurement_interpretation
      direction:
        hrv_component: context_dependent
    fact: >
      The NASA cardiovascular evidence report states that the high-frequency component of the R-R
      interval is an index of parasympathetic modulation, and the low-frequency component of
      systolic blood pressure approximates sympathetic activity. It states that interpretation of
      the low-frequency to high-frequency ratio of the R-R interval is more controversial: some
      studies question the concept and construction of the index, some attribute variation to
      baroreflex function, and some conclude that spectral HRV is mainly a measure of
      parasympathetic activity.
    interpretation: >
      HRV can provide autonomic context, but LF/HF should not be used as a standalone stress or
      "sympathovagal balance" index. HRV trends need posture, respiration, activity, and medication
      context.
    prototype_rule_note: >
      If HRV is used, restrict it to trend context and avoid LF/HF-based rules. Never use HRV alone
      to raise a cardiovascular or stress hypothesis.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Cardiovascular Adaptations Contributing to Cardiovascular Disease or Events (Cardio Risk EB 2022)"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Cardio%20Risk%20EB%202022%20FINAL_4-3-2023.pdf"
      publication_date: "2023-04-03"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Heart rate variability section, report p. 22"
    evidence_strength:
      level: MODERATE
      rationale: "Physiological interpretation is well supported for HF, but LF/HF is explicitly contested in the NASA review."
    population:
      context: "Adults; spaceflight and terrestrial studies"
      size: "Review of multiple studies"
      duration: "Variable"
    thresholds: []
    limitations:
      - "Contested index"
      - "Confounded by posture, respiration, activity, and medication"
      - "Not validated as an astronaut alarm"
    system_use:
      candidate_hypotheses: [H04]
      supports:
        - "HRV interpretation requires context"
      weakens:
        - "LF/HF is a reliable standalone stress marker"
      must_not_be_used_as:
        - "standalone diagnosis"
        - "sympathovagal balance score"
    status:
      recommended_for_mvp: false
      quality_flags: [CONTESTED, CONTEXT_DEPENDENT]

  - id: EVID_HRV_002
    title: "Spaceflight HRV evidence is insufficient for standalone rules"
    domain: [cardiovascular, hrv]
    metrics: [hrv]
    context_features: [posture, activity_level, medication]
    relationship:
      type: evidence_gap
      direction:
        hrv: uncertain
    fact: >
      The NASA cardiovascular evidence report reviews HRV as a noninvasive approximation of
      autonomic activity but does not establish an astronaut-specific HRV threshold or a validated
      HRV-based alarm. The report notes that spectral HRV interpretation is affected by
      baroreflex function and that the LF/HF ratio is contested. Spaceflight HRV studies are
      limited by small samples and by confounders such as posture, activity, and fluid status.
    interpretation: >
      HRV is not sufficient on its own to support a cardiovascular concern in this system. It may
      be recorded as context, but it should not generate a rule by itself.
    prototype_rule_note: >
      Exclude HRV from MVP rule triggers. If retained, use it only as a secondary trend feature
      with explicit data-quality flags.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Cardiovascular Adaptations Contributing to Cardiovascular Disease or Events (Cardio Risk EB 2022)"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Cardio%20Risk%20EB%202022%20FINAL_4-3-2023.pdf"
      publication_date: "2023-04-03"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Heart rate variability section"
    evidence_strength:
      level: INSUFFICIENT
