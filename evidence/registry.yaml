  - id: EVID_SLEEP_007
    title: "Sleep inertia transiently impairs performance after waking"
    domain: [sleep, cognition]
    metrics: [reaction_time, reaction_lapses, sleep_duration]
    context_features: [time_since_wake]
    relationship:
      type: physiological_association
      direction:
        time_since_wake: short
        reaction_time: worsening
    fact: >
      The NASA sleep evidence report states that sleep inertia is an impairment in alertness
      and performance that dissipates asymptotically until approximately two to four hours
      after waking. Its effects are enhanced by prior sleep history, the sleep stage from
      which one is awoken, and circadian phase. The report states that sleep inertia has not
      been evaluated during spaceflight, although astronaut journal reports suggest it occurs.
    interpretation: >
      A test taken shortly after waking may be transiently worse without indicating a
      persistent problem. Repeat testing after the inertia window is more informative.
    prototype_rule_note: >
      Record time since waking. If a post-wake reaction-time result is poor, request a repeat
      after the astronaut has been awake longer before raising concern.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Sleep.pdf"
      publication_date: "2016-04-11"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Sleep Inertia section, report p. 7; spaceflight sleep-inertia gap section"
    evidence_strength:
