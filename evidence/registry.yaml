        sleep_duration: decrease
    fact: >
      The NASA sleep evidence report identifies work overload as one factor leading to reduced
      sleep duration in spaceflight. It also reports that in a survey/interview study, 57% of
      participating astronauts did not perceive any impact from fatigue during their mission,
      while a minority acknowledged mistakes in attention and short-term memory and noticed
      differences in crew-ground interactions when fatigued.
