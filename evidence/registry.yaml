  - id: EVID_BMED_001
    title: "NASA separates adverse behavioral change from psychiatric disorder"
    domain: [behavioral_health, mood, cognition]
    metrics: [mood, fatigue, workload]
    context_features: [functional_impact, interpersonal_interaction]
    relationship:
      type: definitional
      direction:
        behavioral_change: functional_decrement
    fact: >
      NASA differentiates an adverse behavioral change from a psychiatric disorder as follows:
      a behavioral change is any decrement in mood, cognition, morale, or interpersonal
      interaction that adversely affects operational readiness or performance; a psychiatric
      disorder is one that meets DSM criteria for diagnosis. The NASA BMed evidence report uses
      this distinction explicitly.
    interpretation: >
      Monitoring should target observable functional decrements and performance changes, not
      diagnostic labels. This is the correct level of abstraction for a safety-oriented
      monitoring system.
    prototype_rule_note: >
      Hypotheses must be phrased as "behavioral health concern" or "performance change," never
