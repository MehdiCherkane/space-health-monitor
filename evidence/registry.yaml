  - id: EVID_FLUID_003
    title: "Internal jugular flow stagnation and thrombosis have been observed in crew"
    domain: [cardiovascular, fluid_shift, thrombosis]
    metrics: [heart_rate]
    context_features: [ultrasound, flight_day]
    relationship:
      type: human_spaceflight_finding
      direction:
        long_duration_spaceflight: increase
        jugular_flow_stagnation: increase
    fact: >
      The NASA cardiovascular evidence report states that during long-duration spaceflight,
      alterations in left internal jugular vein blood flow patterns were reported after 50 and 150
      days, including stagnant and/or retrograde flow in six of eleven crewmembers. Two incidental
      cases of left internal jugular thrombosis were identified in the study cohort, including one
      occlusive thrombosis treated with anticoagulants onboard the ISS and one partially occlusive
      thrombus identified on retrospective review.
    interpretation: >
      This is a serious but rare thrombotic concern. It is not detectable with routine wearable
      sensors; ultrasound surveillance is required. It should not generate a rule from heart rate or
      SpO2 alone.
    prototype_rule_note: >
      Do not encode a thrombosis rule from wearable data. If neck pain, swelling, or unexplained
      symptoms are reported, escalate to clinical evaluation.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Cardiovascular Adaptations Contributing to Cardiovascular Disease or Events (Cardio Risk EB 2022)"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Cardio%20Risk%20EB%202022%20FINAL_4-3-2023.pdf"
      publication_date: "2023-04-03"
      source_type: NASA_HRP_EVIDENCE_REPORT
