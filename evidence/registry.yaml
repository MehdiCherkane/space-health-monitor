  - id: EVID_BMED_003
    title: "Reported behavioral health event rates are low but heterogeneous across eras"
    domain: [behavioral_health, epidemiology]
    metrics: [mood, stress]
    relationship:
      type: epidemiology
      direction:
        mission_exposure: increase
        behavioral_health_event: increase
    fact: >
      The NASA BMed evidence report states that during the Space Shuttle program, 34 behavioral
      health signs and symptoms were reported among 208 crewmembers who flew on 89 missions
      between 1981 and 1989 (4,442.8 person-days in space), an incidence rate of 0.11 per 14-day
      mission, or approximately one per 2.87 person-years. Across ISS Expeditions 1 through 40,
      9 instances of behavioral health signs and symptoms were included in flight surgeon
      records, an incidence rate of 0.62 per person-year. The report notes that the ISS estimate
      is limited because it is a retrospective review and the symptom types were not captured.
    interpretation: >
      Event rates differ by era, recording method, and mission duration. They are useful as
      context for base rates, not as an individual risk calculator.
    prototype_rule_note: >
      Do not encode these rates as probabilities for an individual. Use them only to justify a
      conservative, low-frequency hypothesis.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Adverse Cognitive or Behavioral Changes and Psychiatric Disorders Leading to In-Mission Health and Performance and Long-Term Health Effects"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/HRP-ER-BMED-HFBP-20250210.pdf"
