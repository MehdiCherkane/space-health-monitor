      mortality, and designs individually tailored medical examinations and surveillance. The
      NASA BMed evidence report notes that LSAH captures information from flight surgeon or crew
      surgeon notes taken during weekly private medical conferences, but that behavioral health
      vulnerabilities or concerns are not available for consistent release.
