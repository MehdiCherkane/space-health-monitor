  - id: EVID_COG_004
    title: "In-flight cognitive findings are inconsistent and operationally ambiguous"
    domain: [cognition, sleep, fatigue]
    metrics: [reaction_time, reaction_lapses]
    relationship:
      type: mixed_evidence
      direction:
        spaceflight: uncertain
        cognition: mixed
    fact: >
      The NASA sleep evidence report states that the most comprehensive study of sleep,
      circadian rhythms, and performance (five astronauts, two Shuttle flights) found only a
      non-significant trend toward worse in-flight performance, with most participants showing
      decline in the last pre-launch week, further decline in flight, and slow post-flight
      recovery. Another study of four astronauts found slightly altered performance on the digit
      symbol substitution and number recognition tasks. The report concludes that limited
      participants and diverse measures make it difficult to evaluate how sleep loss, fatigue,
      circadian desynchronization, and workload translate into performance decrements, and that
      the relationship of these measures to operational performance and errors is unclear.
      In a survey, 57% of interviewed astronauts did not perceive any fatigue impact during
      their mission.
    interpretation: >
      In-flight cognitive degradation is not uniform. Absence of measured degradation does not
      prove the astronaut is rested; presence of degradation does not establish operational
      impairment. Cognitive evidence should be treated as probabilistic and context-dependent.
    prototype_rule_note: >
      Never raise a fatigue concern from a single cognitive result. Require converging sleep,
      workload, and subjective evidence, and prefer personal trend over group comparison.
    source:
      organization: NASA
