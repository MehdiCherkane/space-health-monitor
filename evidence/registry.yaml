      quality_flags: [MODEL_UNCERTAINTY]

  - id: EVID_SPACEWEATHER_001
    title: "NOAA solar radiation storm scale and thresholds"
    domain: [space_weather, radiation]
    metrics: [radiation_dose_rate]
    context_features: [proton_flux, noaa_scale]
    relationship:
      type: operational_definition
      direction:
        proton_flux: increase
        solar_radiation_storm: increase
    fact: >
      NOAA's Space Weather Prediction Center states that a solar radiation storm occurs when a
      large-scale magnetic eruption accelerates charged particles, especially protons, to very high
      velocities. NOAA categorizes storms on an S1-S5 scale based on energetic proton measurements
      from the GOES satellite. The start of a storm is defined as the time when the flux of protons
      at energies of at least 10 MeV equals or exceeds 10 proton flux units (1 pfu = 1 particle
      cm-2 s-1 ster-1). The end is the last time the flux is at or above 10 pfu. Storms can persist
      for hours to days and can damage biological DNA and electronics.
    interpretation: >
      Provides a defensible operational definition of a space-weather event. It is context for
      radiation concern, not a measure of an astronaut's dose.
    prototype_rule_note: >
      Use the NOAA S-scale and proton flux as environmental context. Pair with dosimetry before
      raising a radiation exposure concern.
    source:
      organization: NOAA Space Weather Prediction Center
      title: "Solar Radiation Storm"
      url: "https://www.spaceweather.gov/phenomena/solar-radiation-storm"
      publication_date: "accessed 2026-11-14"
      source_type: NOAA_OPERATIONAL
      location: "Phenomena description and NOAA scale definition"
    evidence_strength:
      level: STRONG
      rationale: "Official operational definition from the responsible agency."
    population:
      context: "Near-Earth and space weather operations"
      size: "Not applicable (operational definition)"
      duration: "Hours to days"
    thresholds:
      - metric: proton_flux_10mev
        value: 10
        unit: pfu
        averaging_window: "event start/end definition"
        context: "S1 solar radiation storm threshold"
        population: "space environment"
        source: "NOAA SWPC Solar Radiation Storm"
    limitations:
      - "Event definition, not an astronaut dose"
      - "Proton flux at GOES is not the same as dose at the crew location"
      - "Storm duration and spectrum vary"
    system_use:
      candidate_hypotheses: [H06]
      supports:
        - "space-weather events can be identified operationally"
      weakens:
        - "a storm threshold equals an astronaut exposure threshold"
      must_not_be_used_as:
        - "standalone diagnosis"
        - "individual dose estimate"
    status:
      recommended_for_mvp: true
      quality_flags: [OPERATIONAL_DEFINITION]

