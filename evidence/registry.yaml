  - id: EVID_RAD_004
    title: "A solar particle event is a hazard, not a confirmed astronaut dose"
    domain: [radiation, space_weather]
    metrics: [radiation_dose_rate, cumulative_radiation_dose]
    context_features: [solar_particle_event, shielding, dosimeter]
    relationship:
      type: interpretation_constraint
      direction:
        solar_particle_event: increase
        radiation_hazard: increase
    fact: >
      The NASA radiation standard and NOAA space-weather documentation describe solar particle
      events and solar radiation storms as hazardous radiation environments. Confirmed astronaut
      dose requires exposure measurement (dosimetry) or a validated exposure model that accounts for
      event timing, location, and shielding. A space-weather event alone does not establish an
      individual's absorbed dose.
    interpretation: >
      Space-weather context can raise concern and prompt dosimetry review, but it cannot substitute
      for dose evidence. The system must keep hazard context and confirmed exposure separate.
    prototype_rule_note: >
      When a solar particle event is active, request a dosimeter reading and shielding/location
      context. Do not infer dose from the event alone.
    source:
      organization: NASA; NOAA
      title: "NASA-STD-3001 Vol 1 Rev C; NOAA SWPC Solar Radiation Storm"
      url: "https://www.spaceweather.gov/phenomena/solar-radiation-storm"
      additional_urls:
        - "https://standards.nasa.gov/sites/default/files/standards/NASA/C/nasa-std-3001-vol-1-rev-c-signature.pdf"
      publication_date: "2023-09-29; accessed 2026-11-14"
      source_type: NASA_STANDARD_AND_NOAA_GUIDANCE
      location: "Radiation environment sections; NOAA solar radiation storm description"
    evidence_strength:
      level: STRONG
      rationale: "Direct consequence of the standard's dose-based limits and NOAA's event definition; an interpretation constraint rather than a study."
    population:
      context: "Spaceflight crews and space weather operations"
      size: "Not applicable"
      duration: "Event duration (hours to days)"
    thresholds: []
    limitations:
      - "Dose models have uncertainty"
      - "Shielding and location can change exposure substantially"
      - "Event forecasting is uncertain"
    system_use:
      candidate_hypotheses: [H06]
      supports:
        - "space weather is context, not dose"
        - "dosimetry is required for confirmed exposure"
      weakens:
        - "a solar particle event confirms astronaut radiation exposure"
      must_not_be_used_as:
        - "standalone diagnosis"
        - "dose estimate without measurement"
    status:
      recommended_for_mvp: true
      quality_flags: [INTERPRETATION_CONSTRAINT, SCOPE_CRITICAL]

  - id: EVID_RAD_005
    title: "Radiation risk models carry substantial uncertainty"
    domain: [radiation, risk_model]
    metrics: [cumulative_radiation_dose]
    relationship:
      type: model_uncertainty
      direction:
        dose: increase
        risk_estimate: uncertain
    fact: >
      NASA-STD-3001 Volume 1 Revision C states that variability and subjectivity in the selection of
      model parameters can easily modify the model output by 25%, and that the model need not be
      updated unless new data indicate a 30% change in the effective dose associated with the 3%
      mean REID calculation.
    interpretation: >
      Radiation risk estimates are not precise individual predictions. The system should present
      dose and risk as estimates with uncertainty, not as exact probabilities.
    prototype_rule_note: >
      Label radiation risk outputs as modeled estimates. Do not present a point estimate without its
      uncertainty context.
    source:
      organization: NASA
      title: "NASA Space Flight Human-System Standard, Volume 1: Crew Health, Revision C"
      url: "https://standards.nasa.gov/sites/default/files/standards/NASA/C/nasa-std-3001-vol-1-rev-c-signature.pdf"
      publication_date: "2023-09-29"
      source_type: NASA_STANDARD
      location: "Rationale for [V1 4030], report p. 43"
    evidence_strength:
      level: MODERATE
      rationale: "Explicit statement of model uncertainty in the standard; not a quantitative validation study."
    population:
      context: "NASA crewmembers"
      size: "Not applicable (standard)"
      duration: "Career"
    thresholds: []
    limitations:
      - "Uncertainty statement, not a confidence interval for an individual"
      - "Model-dependent"
    system_use:
      candidate_hypotheses: [H06]
      supports:
        - "radiation risk must be presented with uncertainty"
      weakens:
        - "a point estimate is an individual probability"
      must_not_be_used_as:
        - "standalone diagnosis"
        - "precise individual risk prediction"
    status:
