# NASA Scientific Evidence Registry
# Scope: autonomous astronaut health monitoring (evidence states, not diagnoses)
# Generated: 2026-11-14
# Companion files: hypothesis_evidence_map.yaml, rule_candidates.yaml, mvp_matrix.md,
#                  source_catalog.md, README.md
#
# STRENGTH MODEL
#   VERY_STRONG  NASA/established medical standard, or multiple strong converging sources;
#                direct operational requirement or consensus definition.
#   STRONG       NASA human-spaceflight evidence or repeated high-quality finding;
#                minor limitations only.
#   MODERATE     Plausible and supported, but limited sample, indirect analog,
#                mixed findings, or uncertain generalizability.
#   WEAK         Suggestive only; single small study or anecdote; not sufficient alone.
#   INSUFFICIENT Cannot support encoding into production reasoning.
#
# RULE: every record separates FACT (what the source establishes), INTERPRETATION
# (how it may be useful), and PROTOTYPE_RULE_NOTE (what we might implement). None of
# these records is a diagnosis or a production rule.

