  - id: EVID_TEMP_001
    title: "NASA cabin temperature and humidity health and performance zones"
    domain: [thermal, environmental_health]
    metrics: [cabin_temperature, relative_humidity]
    context_features: [crew_health_zone, performance_zone]
    relationship:
      type: standard
      direction:
        cabin_temperature: range
        relative_humidity: range
    fact: >
      NASA-STD-3001 Volume 2 Revision D requires cabin temperature and humidity to remain within
      the Crew Health Environmental Limits, anchored at 18 degrees C and 75% relative humidity on
      the upper-left corner and 27 degrees C and 25% relative humidity on the lower-right corner.
      It also requires the system to reach the Crew Performance Environmental Zone, described as
      20-25 degrees C and 30-60% relative humidity, to support thermal comfort and routine
      performance.
    interpretation: >
      These are habitat design and operations limits, not individual clinical thresholds. They
      provide defensible environmental context for a thermal-stress hypothesis.
    prototype_rule_note: >
      Use cabin temperature and humidity as context. If they are outside the performance zone,
      raise an environmental concern and request review, not a medical diagnosis.
    source:
      organization: NASA
      title: "NASA Space Flight Human-System Standard, Volume 2: Human Factors, Habitability, and Environmental Health, Revision D"
      url: "https://standards.nasa.gov/sites/default/files/standards/NASA/D/nasa-std-3001-vol-2-rev-d-signature.pdf"
      publication_date: "2023-09-29"
      source_type: NASA_STANDARD
      location: "Requirements [V2 6012] and [V2 6013], report pp. 53-54"
    evidence_strength:
      level: VERY_STRONG
      rationale: "NASA technical standard with explicit ranges and operating context."
    population:
      context: "Crewed pressurized habitats"
      size: "Not applicable (standard)"
      duration: "Occupied nominal operations, excluding suited operations, ascent, entry, landing, and post-landing"
    thresholds:
