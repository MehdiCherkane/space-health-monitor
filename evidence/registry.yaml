  - id: EVID_SPO2_001
    title: "Pulse oximetry has about 2% accuracy versus arterial blood gas and multiple confounders"
    domain: [spo2, hypoxia, sensor_reliability]
    metrics: [spo2]
    context_features: [perfusion_index, motion, skin_pigment, nail_polish, carboxyhemoglobin]
    relationship:
      type: measurement_error
      direction:
        measurement_artifact: increase
        spo2_accuracy: decrease
    fact: >
      The American Thoracic Society states that most pulse oximeters give a reading 2% over or 2%
      under the saturation obtained by arterial blood gas (for example, a reading of 92% may
      correspond to 90-94%). It lists factors that reduce accuracy: cold hands, not holding still,
      nail polish (especially black, blue, or green), artificial nails, saturation below 80%,
      thicker skin, darker skin pigmentation (oximetry may miss below-normal saturation), and
      smoking (carboxyhemoglobin can make the reading higher than actual oxygen saturation).
    interpretation: >
      A single SpO2 value carries measurement uncertainty and can be falsely low or falsely high.
      Low readings require repetition, signal-quality review, and a second sensor or clinical
      confirmation before a hypoxia hypothesis is raised.
    prototype_rule_note: >
      Never trigger a hypoxia concern from one SpO2 value. Require repeat measurement, perfusion
      index or signal-quality data, and a second sensor where available.
    source:
      organization: American Thoracic Society
      title: "Pulse Oximetry (Patient Education Information Series)"
      url: "https://www.thoracic.org/patients/patient-resources/resources/pulse-oximetry.pdf"
      publication_date: "2011; online version updated 2021-03"
      source_type: CLINICAL_GUIDANCE
      location: "How accurate is the pulse oximeter?"
    evidence_strength:
      level: STRONG
      rationale: "Professional society clinical guidance with a specific accuracy statement and a list of confounders."
    population:
      context: "Adults using pulse oximetry"
      size: "Not applicable (guidance)"
      duration: "Point measurement"
    thresholds: []
    limitations:
      - "Patient education document, not a systematic review"
      - "Accuracy varies by device"
      - "Skin pigmentation bias is device- and population-dependent"
    system_use:
      candidate_hypotheses: [H03, H08]
      supports:
        - "SpO2 needs confirmation before action"
        - "signal quality and sensor placement matter"
      weakens:
        - "one low SpO2 reading establishes hypoxia"
      must_not_be_used_as:
        - "standalone diagnosis"
        - "single-reading alarm"
    status:
      recommended_for_mvp: true
      quality_flags: [CLINICAL_GUIDANCE, MEASUREMENT_ERROR]

  - id: EVID_SPO2_002
    title: "NASA standard: mild hypoxia lower limit of 127 mmHg PIO2 with monitoring"
    domain: [hypoxia, environmental_health]
    metrics: [spo2]
    context_features: [pio2, cabin_pressure, fio2]
    relationship:
      type: standard
      direction:
        pio2: decrease
        hypoxia_risk: increase
    fact: >
      NASA-STD-3001 Volume 2 Revision D, Table 6.2-1, specifies a normoxia target range of 145-155
      mmHg inspired oxygen partial pressure (PIO2), a mild hypoxia lower limit of 127 mmHg, and an
      absolute lower limit of 122 mmHg for the 1-hour time-weighted average. The 127 mmHg condition
      is acceptable indefinitely with monitoring. A footnote states that there is no opportunity to
      collect data in microgravity at 127 mmHg for exploration-class durations, so a health
      monitoring and mitigation plan is required.
    interpretation: >
      This is an environmental exposure standard, not an individual clinical alarm. It establishes
      that a mildly hypoxic cabin atmosphere is permitted only with monitoring and that PIO2 is
      required context for interpreting SpO2.
    prototype_rule_note: >
      Use cabin PIO2 as context. If PIO2 is low and SpO2 is low, request confirmation and review the
      environmental sensor. Do not diagnose hypoxia from SpO2 alone.
    source:
      organization: NASA
      title: "NASA Space Flight Human-System Standard, Volume 2: Human Factors, Habitability, and Environmental Health, Revision D"
      url: "https://standards.nasa.gov/sites/default/files/standards/NASA/D/nasa-std-3001-vol-2-rev-d-signature.pdf"
      publication_date: "2023-09-29"
