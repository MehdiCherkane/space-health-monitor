    fact: >
      The NASA Reaction Self Test source states that neuroimaging studies have documented that
      fatigue affects vigilant attention by causing unpredictable reductions in neural activity
      in distributed brain regions including cognitive control areas in the prefrontal cortex,
      visual processing areas in the occipital lobe, and the thalamus.
    interpretation: >
      Lapses reflect state instability rather than a stable loss of capability. This supports
      repeated sampling: a single good or bad test can misrepresent the underlying state.
    prototype_rule_note: >
