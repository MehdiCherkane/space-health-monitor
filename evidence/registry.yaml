  - id: EVID_BASELINE_003
    title: "Individual variability is substantial across sleep, cardiovascular, and ocular responses"
    domain: [longitudinal_baseline, variability]
    metrics: [sleep_duration, heart_rate, systolic_bp]
    context_features: [interindividual_variability]
    relationship:
      type: variability
      direction:
        individual: variable
    fact: >
      NASA evidence reports describe substantial interindividual variability: sleep duration and
      quality differ across crewmembers; cardiovascular responses to spaceflight and exercise vary;
      SANS findings vary in type and severity; and the fitness report notes high interindividual
      variability in response to exercise prescriptions, with groups of crew returning with greater
      than 10% and greater than 20% losses. The sleep report also notes that sex differences have
      not been systematically studied in spaceflight.
    interpretation: >
      Population averages can hide clinically important individual change. A personal baseline is
      necessary, and sex-specific evidence is incomplete.
    prototype_rule_note: >
      Compute change from the individual's own baseline. Report uncertainty when the evidence base
      is dominated by one sex or a small sample.
