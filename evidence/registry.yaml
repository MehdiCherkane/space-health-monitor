  - id: EVID_FLUID_002
    title: "SANS signs are common in long-duration crew; clinically significant ODE is less common"
    domain: [fluid_shift, ocular, sans]
    metrics: []
    context_features: [flight_duration, ocular_imaging]
    relationship:
      type: prevalence
      direction:
        long_duration_spaceflight: increase
        sans_signs: increase
    fact: >
      The NASA SANS evidence report states that about 70% of crewmembers who have participated in
      long-duration missions show one or more signs of SANS, and about 15% develop clinically
      significant mild optic disc edema (Frisén grade >= 1). A 2008 Russian study of 16 cosmonauts
      identified 8 cases of ODE ranging from partial to moderate, with mild and moderate cases in at
      least 3 of 16 (approximately 19%). The report states that no documented cases of uncorrectable
      changes in visual acuity and no permanent changes to visual fields have been documented
      during or after long-duration spaceflight.
    interpretation: >
      SANS is common but usually subclinical. The monitoring system does not measure ocular
      structure, so it cannot detect SANS; this record is population context, not a rule input.
    prototype_rule_note: >
      Do not create a SANS rule from wearable data. If ocular symptoms are reported, route to
      clinical evaluation.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Spaceflight Associated Neuro-ocular Syndrome (SANS)"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/SANS%20EB%202022%20FINAL_8-15-22.pdf"
      publication_date: "2022-08-15"
      source_type: NASA_HRP_EVIDENCE_REPORT
