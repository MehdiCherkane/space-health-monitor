  - id: EVID_COG_001
    title: "PVT is the dominant sensitive measure of sleep-loss effects on vigilance"
    domain: [cognition, sleep, fatigue]
    metrics: [reaction_time, reaction_lapses]
    context_features: [false_starts, response_variability]
    relationship:
      type: measurement_validity
      direction:
        sleep_loss: increase
        reaction_time: worsening
        reaction_lapses: increase
    fact: >
      The NASA sleep evidence report states that vigilance is the component of cognition
      most consistently and significantly affected by sleep loss, and that the Psychomotor
      Vigilance Task (PVT) has emerged as the dominant means of evaluation. The PVT has been
      used in hundreds of studies and is sensitive and reliable for sleepiness arising from
      sleep loss and circadian desynchrony. It captures mean reaction time, lapses (errors of
      omission), and false starts (errors of commission).
    interpretation: >
      A PVT-style test can provide objective evidence of fatigue-related performance change.
      Lapses and false starts are more specific to vigilance instability than mean reaction
      time alone.
    prototype_rule_note: >
      Use a short PVT as one evidence source, not as a diagnosis. Require a trend and
      corroborating sleep/workload context before escalating.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Sleep.pdf"
      publication_date: "2016-04-11"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Measuring the impact of sleep loss using the psychomotor vigilance task; Laboratory evaluations section"
    evidence_strength:
      level: STRONG
      rationale: "Extensive validation literature summarized by NASA; consistent across laboratory and field studies."
    population:
      context: "Laboratory volunteers and astronauts"
      size: "Hundreds of studies; exact N not stated in the cited passage"
      duration: "Acute and chronic sleep-loss exposures"
    thresholds: []
    limitations:
      - "Gold-standard versions are 10-20 minutes, longer than a short operational test"
      - "Short versions are less sensitive"
      - "Motivation and test environment affect results"
    system_use:
      candidate_hypotheses: [H01]
      supports:
        - "reaction-time degradation strengthens fatigue concern"
        - "lapses and false starts are meaningful objective signals"
      weakens:
        - "subjective fatigue alone is sufficient to exclude fatigue-related degradation"
      must_not_be_used_as:
        - "standalone diagnosis"
        - "absolute impairment threshold"
    status:
      recommended_for_mvp: true
      quality_flags: [VALIDATED_INSTRUMENT]

  - id: EVID_COG_002
    title: "Short PVT versions trade sensitivity for operational feasibility"
    domain: [cognition, sleep]
    metrics: [reaction_time, reaction_lapses]
    relationship:
      type: measurement_comparison
      direction:
        test_duration: decrease
        sensitivity: decrease
    fact: >
      The NASA sleep evidence report describes a 3-minute PVT-B that discriminated alert from
      sleep-deprived individuals, but with an effect attenuated relative to the 10-minute PVT.
      An adaptive-duration PVT-A showed reliable agreement with the 10-minute PVT; its average
      duration was 6.5 minutes, indicating that some individuals may not show impairment until
      several minutes into the test. The report concludes that a longer version is preferable,
      but the PVT-A may be sufficient to capture sleep-loss-related impairment.
    interpretation: >
      A very short reaction-time test is feasible but can miss impairment. A negative short
      test is weaker evidence of fitness than a negative longer test.
    prototype_rule_note: >
      Use the short test for frequent sampling and trend detection. Escalate to a longer
      repeat when the short test is borderline or when other fatigue evidence is present.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Sleep.pdf"
      publication_date: "2016-04-11"
      source_type: NASA_HRP_EVIDENCE_REPORT
      location: "Measuring the impact of sleep loss using the psychomotor vigilance task"
    evidence_strength:
      level: STRONG
      rationale: "Multiple validation comparisons summarized by NASA; consistent direction of effect."
    population:
      context: "Laboratory volunteers"
      size: "Multiple validation studies; exact N not stated in the cited passage"
      duration: "Total and partial sleep deprivation protocols"
    thresholds: []
    limitations:
      - "Laboratory validation; limited operational flight validation"
      - "Test duration and inter-stimulus interval differ across versions"
      - "Individual differences in optimal test duration"
    system_use:
      candidate_hypotheses: [H01]
      supports:
        - "short-test results should be interpreted with a sensitivity caveat"
        - "repeat testing improves confidence"
      weakens:
