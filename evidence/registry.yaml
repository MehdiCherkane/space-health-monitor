  - id: EVID_HYPOXIA_002
    title: "Mild decompression and hypoxia symptoms are underreported and can be masked"
    domain: [hypoxia, eva, symptom_reporting]
    metrics: [spo2]
    context_features: [eva, symptom_report, repressurization]
    relationship:
      type: reporting_bias
      direction:
        symptom_severity: mild
        reporting: decrease
    fact: >
      The NASA hypoxia and DCS evidence report states that under-reporting of DCS symptoms is
      routinely observed in pilot training, that mild symptoms may be masked during EVA because they
      are attributed to pain from working in the suit, and that symptoms often clear during
      repressurization. It notes that the incidence of DCS symptoms that would interfere with
      performance in an EMU is less than 5%, and that about 85% of those with symptoms showed
      improvement or no change when tests proceeded past the first symptom report.
    interpretation: >
      Self-reported symptoms are an incomplete signal. Physiological and environmental data can
      supplement reporting, but they cannot replace clinical evaluation.
    prototype_rule_note: >
      Ask a structured symptom question after EVA and when SpO2 or cognition changes. Do not treat
      "no reported symptoms" as proof of no effect.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Hypoxia and Decompression Sickness (Hypoxia and DCS)"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Evidence%20Report%20Hypoxia%20and%20DCS_FINAL_1-8-2024.pdf"
