  - id: EVID_CO2_001
    title: "NASA standard: average 1-hour cabin ppCO2 no more than 3 mmHg"
    domain: [co2, environmental_health]
    metrics: [cabin_co2]
    context_features: [ppco2, averaging_window]
    relationship:
      type: standard
      direction:
        cabin_co2: increase
        health_risk: increase
    fact: >
      NASA-STD-3001 Volume 2 Revision D requirement [V2 6004] states that the system shall limit
      the average one-hour carbon dioxide partial pressure (ppCO2) in the habitable volume to no
      more than 3 mmHg.
    interpretation: >
      This is the primary environmental CO2 limit for crewed habitats. It is an engineering and
      operations requirement, not an individual clinical alarm.
    prototype_rule_note: >
      Compare cabin ppCO2 with the 3 mmHg 1-hour average. Treat an exceedance as an environmental
      concern and request review, not as a medical diagnosis.
    source:
      organization: NASA
      title: "NASA Space Flight Human-System Standard, Volume 2: Human Factors, Habitability, and Environmental Health, Revision D"
      url: "https://standards.nasa.gov/sites/default/files/standards/NASA/D/nasa-std-3001-vol-2-rev-d-signature.pdf"
      publication_date: "2023-09-29"
      source_type: NASA_STANDARD
      location: "Requirement [V2 6004], report p. 51"
    evidence_strength:
      level: VERY_STRONG
      rationale: "NASA technical standard with an explicit value, averaging window, and operational context."
    population:
      context: "Crewed pressurized habitats"
      size: "Not applicable (standard)"
      duration: "1-hour average"
    thresholds:
      - metric: cabin_co2
        value: 3
        unit: mmHg
        averaging_window: "1_hour"
        context: "average ppCO2 in the habitable volume"
        population: "crewmembers in pressurized habitats"
        source: "NASA-STD-3001 Vol 2 Rev D [V2 6004]"
    limitations:
      - "Environmental standard, not an individual clinical threshold"
      - "Applies to habitable volume, not to a personal sensor"
      - "Off-nominal CO2 values are outside the standard's scope"
    system_use:
      candidate_hypotheses: [H02]
      supports:
