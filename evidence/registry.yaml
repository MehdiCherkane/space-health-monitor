  - id: EVID_SLEEP_006
    title: "Sleep-promoting medication use is common during spaceflight"
    domain: [sleep, pharmacology]
    metrics: [sleep_duration, sleep_quality]
    context_features: [sleep_medication_use]
    relationship:
      type: prevalence
      direction:
        sleep_medication_use: common
    fact: >
      The NASA sleep evidence report states that about three-quarters of both Shuttle and
      ISS astronauts reported using sleep medications during their missions, including on
      52% of nights aboard the Shuttle (Barger et al. 2014). Sleep medication use was
      associated with faster sleep latency but not with longer sleep duration.
    interpretation: >
      Medication use is common and is a confounder for sleep duration, sleep quality, and
      next-day performance. It should be captured as context, not treated as evidence of a
      sleep disorder.
    prototype_rule_note: >
      Ask about sleep-medication use when sleep or next-day performance changes. Do not
      infer a disorder from use alone.
    source:
