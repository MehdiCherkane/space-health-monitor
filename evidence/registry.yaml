        aerobic_capacity: decrease
        muscle_strength: decrease
    fact: >
      The NASA fitness evidence report concludes that aerobic capacity, muscle strength, and muscle
      endurance decrease following short- and long-duration spaceflight and after bed rest. The
      losses depend on mission duration and on the exercise countermeasures crew perform in flight.
      No controlled in-flight studies of exercise countermeasure effectiveness have been conducted;
      bed-rest studies show protection. Recent ISS data show high interindividual variability, with
      groups of crew returning to Earth with greater than 10% and greater than 20% loss. The report
      also states that there are no reports of impaired performance of activities in microgravity,
      but decreased capacity may affect work efficiency and EVA performance.
    interpretation: >
      Exercise is both a countermeasure and a confounder. Exercise duration and intensity are needed
      to interpret heart rate, fatigue, and activity changes. A decline in exercise capacity is not
      by itself a clinical event.
    prototype_rule_note: >
      Record exercise duration and intensity as context. Do not infer deconditioning from a single
      activity or heart-rate observation.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Impaired Performance Due to Reduced Muscle Mass, Strength & Endurance (Muscle) and Aerobic Capacity"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Evidence%20report%20aerobic%20and%20muscle_FINAL%204-3-2024.pdf"
      publication_date: "2024-04-03"
