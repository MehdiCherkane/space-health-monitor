  - id: EVID_HYPOXIA_001
    title: "Hypoxia onset can be insidious; NASA recommends pulse oximetry with perfusion index"
    domain: [hypoxia, spo2, cognition]
    metrics: [spo2, reaction_time, heart_rate]
    context_features: [perfusion_index, pio2, symptoms]
    relationship:
      type: clinical_recommendation
      direction:
        hypoxia: increase
        symptom_recognition: delayed
    fact: >
      The NASA hypoxia evidence report states that the insidious onset of hypoxia can affect
      individual readiness and crew capability severely enough that critical tasks such as piloting
      may be affected. It recommends an in-flight monitoring plan that includes environmental
      control and life support monitoring, oxygen saturation using pulse oximetry with perfusion
      index for signal-quality validation, sleep actigraphy, vascular ultrasound, cognition, and
      exercise performance.
    interpretation: >
      Hypoxia may not present with obvious symptoms. SpO2 plus signal-quality data plus cognitive
      and environmental context is more informative than any single measure.
    prototype_rule_note: >
      Combine SpO2, perfusion index, PIO2, and symptom report. If they disagree, request a repeat
      measurement and review the environmental sensor before raising concern.
    source:
      organization: NASA
      title: "Evidence Report: Risk of Hypoxia and Decompression Sickness (Hypoxia and DCS)"
      url: "https://humanresearchroadmap.nasa.gov/Evidence/reports/Evidence%20Report%20Hypoxia%20and%20DCS_FINAL_1-8-2024.pdf"
