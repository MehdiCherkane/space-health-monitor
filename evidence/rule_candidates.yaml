      any:
        - cumulative_dose_approaching_career_limit
        - organ_dose_approaching_organ_limit
        - acute_exposure_near_short_term_limit
    strengthening_evidence:
      - high_dose_rate
      - long_mission_duration
      - low_shielding
      - solar_particle_event
      - repeated_evas
    contradicting_evidence:
      - dose_well_below_limit
      - model_uncertainty_exceeds_margin
      - event_without_dosimetry
    missing_evidence_requests:
      - dosimeter_reading
      - shielding_and_location
      - organ_specific_dose
      - event_timing_and_spectrum
    scientific_basis:
      - EVID_RAD_001
      - EVID_RAD_002
      - EVID_RAD_003
      - EVID_RAD_005
      - EVID_SPACEWEATHER_001
    thresholds:
      - record: EVID_RAD_001
        use: "career effective dose < 600 mSv, corresponding to 3% mean REID"
      - record: EVID_RAD_002
        use: "organ-specific career and short-term limits"
    recommended_actions:
      - review_dosimeter_data
      - review_shielding_and_location
      - check_space_weather_status
      - escalate_to_radiation_health_protocol_if_limit_approached
    prohibited_outputs:
      - cancer_diagnosis
      - individual_cancer_risk_prediction
      - dose_estimate_without_measurement
    status: HUMAN_REVIEW_REQUIRED
    encoding_status: CANDIDATE_FOR_MVP
    notes: >
      This is a limit-tracking rule, not a medical diagnostic rule. Dose and risk are modeled
      estimates with substantial uncertainty (EVID_RAD_005).

