# Rule Candidates
# These are NOT production rules. They are qualitative reasoning candidates for human review,
# derived from registry.yaml and hypothesis_evidence_map.yaml.
#
# STRENGTH is qualitative: STRONG | MODERATE | WEAK | INSUFFICIENT.
# No numeric confidence weights are used.
# Every rule requires human review before any operational action beyond measurement and reassessment.
#
# REQUIRED_EVIDENCE semantics:
#   all: every item must be present
#   any: at least one item must be present
# Items are evidence features, not raw thresholds. Threshold-bearing features name the registry
# record that supplies value, unit, window, population, and source.

schema_version: "1.0"
generated: "2026-11-14"
rule_count: 16

rules:

  - id: RULE_CANDIDATE_001
    name: fatigue_related_performance_degradation
    hypothesis: H01
    strength: MODERATE
    required_evidence:
      any:
        - sustained_sleep_deficit_vs_personal_baseline
        - reaction_time_degradation_vs_personal_baseline
        - reaction_lapse_increase_vs_personal_baseline
      all:
        - fatigue_context_present
    strengthening_evidence:
      - high_workload
      - circadian_disruption
      - sleep_medication_use
      - extended_time_since_wake
      - subjective_fatigue_increase
    contradicting_evidence:
      - sleep_duration_within_personal_baseline
      - stable_reaction_time_trend
      - no_functional_impact_reported
      - alternative_explanation_present
    missing_evidence_requests:
      - repeat_reaction_time_test
      - sleep_and_workload_report
      - time_since_wake
      - personal_baseline_for_sleep_and_reaction_time
    scientific_basis:
      - EVID_SLEEP_002
      - EVID_SLEEP_003
      - EVID_SLEEP_004
      - EVID_COG_001
      - EVID_COG_002
      - EVID_COG_004
      - EVID_FATIGUE_001
    recommended_actions:
      - repeat_cognitive_test
      - request_sleep_and_workload_report
      - review_schedule_and_workload
      - human_review_if_persistent
    prohibited_outputs:
      - sleep_disorder_diagnosis
      - cognitive_impairment_diagnosis
      - fitness_for_duty_determination
    status: HUMAN_REVIEW_REQUIRED
    encoding_status: CANDIDATE_FOR_MVP
    notes: >
      A single test is never sufficient. In-flight cognitive findings are inconsistent
      (EVID_COG_004), so the rule requires a personal trend plus context.

